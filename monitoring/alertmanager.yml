# AlertManager Configuration for X-Agent
# Handles alert routing, grouping, and notifications
global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  opsgenie_api_url: 'https://api.opsgenie.com/'

# The root route applies to all alerts
route:
  receiver: 'default-receiver'
  group_by: [ 'alertname', 'cluster', 'service' ]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Sub-routes for specific alert types
  routes:
    # Critical alerts -> immediate PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    # Warning alerts -> Slack
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s
      repeat_interval: 4h

    # Database alerts -> DBA team
    - match:
        component: database
      receiver: 'dba-team'
      group_wait: 30s

    # LLM alerts -> Platform team
    - match:
        component: llm
      receiver: 'platform-team'
      group_wait: 10s

    # Agent alerts -> Operations team
    - match:
        component: agent
      receiver: 'operations-team'
      group_wait: 30s

    # Infrastructure alerts -> SRE team
    - match:
        component: infrastructure
      receiver: 'sre-team'
      group_wait: 30s

# Receivers define notification channels
receivers:
  # Default receiver
  - name: 'default-receiver'
    slack_configs:
      - channel: '#alerts'
        title: '[{{ .GroupLabels.severity | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

  # Critical receiver with PagerDuty
  - name: 'critical-receiver'
    slack_configs:
      - channel: '#critical-alerts'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        color: 'danger'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'

  # Warning receiver
  - name: 'warning-receiver'
    slack_configs:
      - channel: '#warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        color: 'warning'
        send_resolved: true

  # DBA team
  - name: 'dba-team'
    slack_configs:
      - channel: '#dba-alerts'
        title: '[DB] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

  # Platform team
  - name: 'platform-team'
    slack_configs:
      - channel: '#platform-alerts'
        title: '[LLM] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

  # Operations team
  - name: 'operations-team'
    slack_configs:
      - channel: '#ops-alerts'
        title: '[Agent] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

  # SRE team
  - name: 'sre-team'
    slack_configs:
      - channel: '#sre-alerts'
        title: '[Infrastructure] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

# Inhibition rules prevent certain alerts from firing when others are active
inhibit_rules:
  # Suppress low-priority alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: [ 'alertname', 'component' ]

  # Suppress alerts if application is down
  - source_match:
      alertname: 'XAgentApplicationDown'
    target_match_re:
      alertname: '.*'
    equal: [ 'instance' ]

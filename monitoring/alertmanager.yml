global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  opsgenie_api_key: '${OPSGENIE_API_KEY}'
  opsgenie_api_url: 'https://api.opsgenie.com/'

# Email configuration
smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
smtp_auth_username: '${SMTP_USERNAME}'
smtp_auth_password: '${SMTP_PASSWORD}'
smtp_from: '${SMTP_FROM}'
smtp_require_tls: true

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    # Critical alerts - immediate notification via multiple channels
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m
      continue: true

    # Warning alerts - grouped notification
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      group_interval: 30m
      repeat_interval: 1h

    # Info alerts - daily digest
    - match:
        severity: info
      receiver: 'info'
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h

    # Database alerts - dedicated channel
    - match:
        component: database
      receiver: 'database'
      group_wait: 10s
      group_interval: 10m
      repeat_interval: 1h

    # API alerts - dedicated channel
    - match:
        component: api
      receiver: 'api'
      group_wait: 10s
      group_interval: 10m
      repeat_interval: 1h

    # System alerts - dedicated channel
    - match:
        component: system
      receiver: 'system'
      group_wait: 10s
      group_interval: 10m
      repeat_interval: 1h

receivers:
  # Default receiver
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: 'X-Agent Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Critical alerts - multiple channels
  - name: 'critical'
    slack_configs:
      - channel: '#critical-alerts'
        title: 'CRITICAL: X-Agent Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook_url }}{{ end }}'
        send_resolved: true
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
    opsgenie_configs:
      - api_key: '${OPSGENIE_API_KEY}'
        description: '{{ .GroupLabels.alertname }}'
        details:
          severity: '{{ .GroupLabels.severity }}'
          component: '{{ .GroupLabels.component }}'
    email_configs:
      - to: '${CRITICAL_ALERT_EMAIL}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_HOST}:${SMTP_PORT}'
        auth_username: '${SMTP_USERNAME}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'CRITICAL: X-Agent Alert - {{ .GroupLabels.alertname }}'

  # Warning alerts
  - name: 'warning'
    slack_configs:
      - channel: '#warnings'
        title: 'WARNING: X-Agent Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'
    email_configs:
      - to: '${WARNING_ALERT_EMAIL}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_HOST}:${SMTP_PORT}'
        auth_username: '${SMTP_USERNAME}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'WARNING: X-Agent Alert - {{ .GroupLabels.alertname }}'

  # Info alerts
  - name: 'info'
    slack_configs:
      - channel: '#info-alerts'
        title: 'INFO: X-Agent Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'good'

  # Database alerts
  - name: 'database'
    slack_configs:
      - channel: '#database-alerts'
        title: 'Database Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_DATABASE_KEY}'
        description: '{{ .GroupLabels.alertname }}'

  # API alerts
  - name: 'api'
    slack_configs:
      - channel: '#api-alerts'
        title: 'API Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # System alerts
  - name: 'system'
    slack_configs:
      - channel: '#system-alerts'
        title: 'System Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Suppress warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service', 'component']

  # Suppress info alerts when warning or critical alerts are firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service', 'component']

  # Suppress low-level alerts when service is down
  - source_match:
      alertname: 'APIServiceDown'
    target_match_re:
      alertname: 'High.*|Low.*'
    equal: ['service']

  # Suppress database-related alerts when database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: 'HighDatabaseLatency|DatabaseConnectionPool.*'
    equal: ['service']

  # Suppress cache-related alerts when cache is down
  - source_match:
      alertname: 'CacheDown'
    target_match_re:
      alertname: 'LowCacheHitRate|.*Cache.*'
    equal: ['service']


global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'xagent-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

scrape_configs:
  # X-Agent Backend
  - job_name: 'xagent-backend'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/api/v1/metrics/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # X-Agent Workers
  - job_name: 'xagent-workers'
    static_configs:
      - targets: ['localhost:8001', 'localhost:8002', 'localhost:8003']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['localhost:9200']
    metrics_path: '/_prometheus/metrics'

  # Redis (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

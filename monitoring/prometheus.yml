# Prometheus Configuration for X-Agent
# Scrape configuration with service discovery and remote storage
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    service: 'xagent'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  # X-Agent API metrics
  - job_name: 'xagent-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: [ 'xagent-api:8000' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # PostgreSQL Exporter
  - job_name: 'postgres'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # Redis Exporter
  - job_name: 'redis'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # Qdrant Vector DB
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'qdrant:6333' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'cadvisor:8080' ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance

  # Langfuse (LLM observability)
  - job_name: 'langfuse'
    metrics_path: '/api/public/metrics'
    scheme: 'https'
    static_configs:
      - targets: [ 'cloud.langfuse.com' ]
    scrape_interval: 60s

  # Blackbox Exporter (endpoint health checks)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [ http_2xx ]
    static_configs:
      - targets:
          - 'https://api.xagent.io/health'
          - 'https://dashboard.xagent.io/health'
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox:9115'

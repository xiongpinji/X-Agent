global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'x-agent-monitor'
    environment: '${ENVIRONMENT:-development}'
    cluster: '${CLUSTER_NAME:-default}'

# Remote storage configuration for long-term retention
remote_write:
  - url: "http://prometheus-remote-storage:9009/api/v1/write"
    queue_config:
      capacity: 10000
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 500
      batch_send_wait: 5s
      min_backoff: 30ms
      max_backoff: 100ms

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
    - consul_sd_configs:
        - server: 'consul:8500'
          datacenter: 'dc1'
          services: ['alertmanager']

rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

scrape_configs:
  # X-Agent API Server
  - job_name: 'x-agent-api'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'api'
          component: 'core'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # X-Agent Worker
  - job_name: 'x-agent-worker'
    static_configs:
      - targets: ['localhost:8001']
        labels:
          service: 'worker'
          component: 'execution'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node Exporter (System metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
          component: 'infrastructure'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Qdrant Vector Database
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          component: 'vector-db'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
        labels:
          service: 'elasticsearch'
          component: 'logging'
    metrics_path: '/_prometheus/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Service discovery via Consul (optional)
  - job_name: 'consul-services'
    consul_sd_configs:
      - server: 'consul:8500'
        datacenter: 'dc1'
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_node]
        target_label: node

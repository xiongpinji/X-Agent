global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# The root route with all parameters, which are inherited by the child routes if they are not overwritten.
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 1h
      continue: true

    # Warning alerts - delayed notification
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 4h

    # API component alerts
    - match:
        component: api
      receiver: 'api-team'
      group_wait: 10s
      group_interval: 10m

    # Database component alerts
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 5s
      group_interval: 5m

    # Agent component alerts
    - match:
        component: agent
      receiver: 'agent-team'
      group_wait: 10s
      group_interval: 10m

    # LLM component alerts
    - match:
        component: llm
      receiver: 'llm-team'
      group_wait: 10s
      group_interval: 15m

# Inhibition rules to suppress certain alerts
inhibit_rules:
  # Suppress warning alerts if critical alert exists
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Suppress service down alerts if parent service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'WorkerDown'
    equal: ['cluster']

# Receivers configuration
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: 'team@example.com'
        from: 'alertmanager@xagent.local'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '[X-Agent Alert] {{ .GroupLabels.alertname }}'

  # Critical alerts - PagerDuty + Slack + Email
  - name: 'critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
    slack_configs:
      - channel: '#alerts-critical'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'danger'
        send_resolved: true
        actions:
          - type: button
            text: 'View in Grafana'
            url: 'http://grafana.local:3000'
          - type: button
            text: 'View in Prometheus'
            url: 'http://prometheus.local:9090'
    email_configs:
      - to: 'oncall@example.com'
        from: 'alertmanager@xagent.local'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  # Warning alerts - Slack + Email
  - name: 'warning'
    slack_configs:
      - channel: '#alerts-warning'
        title: 'Warning Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'warning'
        send_resolved: true
    email_configs:
      - to: 'team@example.com'
        from: 'alertmanager@xagent.local'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'

  # API team alerts
  - name: 'api-team'
    slack_configs:
      - channel: '#api-alerts'
        title: 'API Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        send_resolved: true

  # Database team alerts
  - name: 'database-team'
    slack_configs:
      - channel: '#database-alerts'
        title: 'Database Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_DB_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

  # Agent team alerts
  - name: 'agent-team'
    slack_configs:
      - channel: '#agent-alerts'
        title: 'Agent Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        send_resolved: true

  # LLM team alerts
  - name: 'llm-team'
    slack_configs:
      - channel: '#llm-alerts'
        title: 'LLM Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        send_resolved: true

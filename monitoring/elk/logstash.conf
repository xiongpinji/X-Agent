input {
  # File input for X-Agent logs
  file {
    path => "/var/log/xagent/*.log"
    type => "xagent"
    codec => json
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb"
    tags => ["xagent", "json"]
  }

  # Syslog input for system logs
  syslog {
    port => 5000
    type => "syslog"
    tags => ["syslog"]
  }

  # HTTP input for direct log submission
  http {
    port => 8080
    codec => json
    type => "http"
    tags => ["http"]
  }

  # TCP input for structured logs
  tcp {
    port => 5001
    codec => json
    type => "tcp"
    tags => ["tcp"]
  }
}

filter {
  # Parse JSON logs
  if [type] == "xagent" {
    json {
      source => "message"
      target => "log_data"
    }

    # Extract timestamp
    date {
      match => ["[log_data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    # Extract log level
    mutate {
      add_field => {
        "log_level" => "%{[log_data][level]}"
        "logger_name" => "%{[log_data][logger]}"
        "module" => "%{[log_data][module]}"
        "function" => "%{[log_data][function]}"
        "line_number" => "%{[log_data][line]}"
      }
    }

    # Parse exception information
    if [log_data][exception] {
      mutate {
        add_field => {
          "exception" => "%{[log_data][exception]}"
        }
      }
    }

    # Add environment tags
    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "version" => "${APP_VERSION:0.1.0}"
      }
    }
  }

  # Parse syslog
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
  }

  # Parse HTTP logs
  if [type] == "http" {
    json {
      source => "message"
    }
  }

  # Parse TCP logs
  if [type] == "tcp" {
    json {
      source => "message"
    }
  }

  # Add GeoIP information if IP is present
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["log_data"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
    index => "xagent-%{+YYYY.MM.dd}"
    document_type => "_doc"
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    ssl => true
    ssl_certificate_verification => false
  }

  # Also output to stdout for debugging (can be disabled in production)
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }

  # Send critical errors to a separate index
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
      index => "xagent-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
      ssl => true
      ssl_certificate_verification => false
    }
  }
}

input {
  # File input for X-Agent application logs
  file {
    path => "/var/log/xagent/app.log"
    type => "xagent-app"
    codec => json
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb_app"
    tags => ["xagent", "application", "json"]
  }

  # File input for X-Agent error logs
  file {
    path => "/var/log/xagent/error.log"
    type => "xagent-error"
    codec => json
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb_error"
    tags => ["xagent", "error", "json"]
  }

  # File input for X-Agent audit logs
  file {
    path => "/var/log/xagent/audit.log"
    type => "xagent-audit"
    codec => json
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb_audit"
    tags => ["xagent", "audit", "json"]
  }

  # Syslog input for system logs
  syslog {
    port => 5000
    type => "syslog"
    tags => ["syslog", "system"]
  }

  # HTTP input for direct log submission
  http {
    port => 8080
    codec => json
    type => "http"
    tags => ["http", "direct"]
  }

  # TCP input for structured logs
  tcp {
    port => 5001
    codec => json
    type => "tcp"
    tags => ["tcp", "structured"]
  }

  # UDP input for lightweight logging
  udp {
    port => 5002
    codec => json
    type => "udp"
    tags => ["udp", "lightweight"]
  }
}

filter {
  # ============ Parse X-Agent Application Logs ============
  if [type] == "xagent-app" {
    json {
      source => "message"
      target => "log_data"
    }

    # Extract timestamp
    date {
      match => ["[log_data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    # Extract log level and details
    mutate {
      add_field => {
        "log_level" => "%{[log_data][level]}"
        "logger_name" => "%{[log_data][logger]}"
        "module" => "%{[log_data][module]}"
        "function" => "%{[log_data][function]}"
        "line_number" => "%{[log_data][line]}"
        "request_id" => "%{[log_data][request_id]}"
        "user_id" => "%{[log_data][user_id]}"
        "duration_ms" => "%{[log_data][duration_ms]}"
      }
    }

    # Extract performance metrics
    if [log_data][duration_ms] {
      mutate {
        convert => { "duration_ms" => "float" }
      }
    }

    # Add environment tags
    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "application"
        "version" => "${APP_VERSION:0.1.0}"
      }
    }
  }

  # ============ Parse X-Agent Error Logs ============
  if [type] == "xagent-error" {
    json {
      source => "message"
      target => "log_data"
    }

    date {
      match => ["[log_data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "log_level" => "ERROR"
        "error_type" => "%{[log_data][error_type]}"
        "error_message" => "%{[log_data][error_message]}"
        "stack_trace" => "%{[log_data][stack_trace]}"
        "request_id" => "%{[log_data][request_id]}"
        "user_id" => "%{[log_data][user_id]}"
      }
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "error-handler"
        "severity" => "high"
      }
    }
  }

  # ============ Parse X-Agent Audit Logs ============
  if [type] == "xagent-audit" {
    json {
      source => "message"
      target => "log_data"
    }

    date {
      match => ["[log_data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "log_level" => "INFO"
        "event_type" => "%{[log_data][event_type]}"
        "actor" => "%{[log_data][actor]}"
        "resource" => "%{[log_data][resource]}"
        "action" => "%{[log_data][action]}"
        "result" => "%{[log_data][result]}"
        "details" => "%{[log_data][details]}"
      }
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "audit"
      }
    }
  }

  # ============ Parse Syslog ============
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "system"
        "component" => "syslog"
      }
    }
  }

  # ============ Parse HTTP Logs ============
  if [type] == "http" {
    json {
      source => "message"
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "http-input"
      }
    }
  }

  # ============ Parse TCP Logs ============
  if [type] == "tcp" {
    json {
      source => "message"
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "tcp-input"
      }
    }
  }

  # ============ Parse UDP Logs ============
  if [type] == "udp" {
    json {
      source => "message"
    }

    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:development}"
        "service" => "xagent"
        "component" => "udp-input"
      }
    }
  }

  # ============ Add GeoIP Information ============
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # ============ Normalize Log Levels ============
  mutate {
    lowercase => [ "log_level" ]
  }

  # ============ Add Severity Based on Log Level ============
  if [log_level] == "error" or [log_level] == "critical" or [log_level] == "fatal" {
    mutate {
      add_field => { "severity" => "high" }
    }
  } else if [log_level] == "warn" or [log_level] == "warning" {
    mutate {
      add_field => { "severity" => "medium" }
    }
  } else {
    mutate {
      add_field => { "severity" => "low" }
    }
  }

  # ============ Remove Unnecessary Fields ============
  mutate {
    remove_field => ["log_data", "host"]
  }
}

output {
  # ============ Send to Elasticsearch ============
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
    index => "xagent-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    ssl => false
    ssl_certificate_verification => false
  }

  # ============ Send Critical Errors to Separate Index ============
  if [severity] == "high" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
      index => "xagent-critical-%{+YYYY.MM.dd}"
      document_type => "_doc"
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
      ssl => false
      ssl_certificate_verification => false
    }
  }

  # ============ Send Audit Logs to Separate Index ============
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
      index => "xagent-audit-%{+YYYY.MM.dd}"
      document_type => "_doc"
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
      ssl => false
      ssl_certificate_verification => false
    }
  }

  # ============ Debug Output ============
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}


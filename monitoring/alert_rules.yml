# Prometheus Alert Rules for X-Agent
# Reload with: curl -X POST http://localhost:9090/-/reload
groups:
  - name: xagent_application
    interval: 30s
    rules:
      # Application Availability
      - alert: XAgentApplicationDown
        expr: up{job="xagent-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "X-Agent API is down"
          description: "X-Agent API ({{ $labels.instance }}) has been down for more than 2 minutes"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High request latency detected"
          description: "P99 latency is {{ $value }}s on {{ $labels.instance }}"

      # Database Health
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance ({{ $labels.instance }}) is unreachable"

      - alert: PostgreSQLConnectionHigh
        expr: |
          pg_stat_activity_count{datname="xagent"} > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection pool near limit"
          description: "Current connections: {{ $value }}/100 on {{ $labels.instance }}"

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_slow_queries_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High rate of slow queries"
          description: "Slow query rate: {{ $value }} per second"

      # Cache/Redis Health
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis instance ({{ $labels.instance }}) is unreachable"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage: {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Qdrant Vector DB
      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: warning
          component: vectordb
        annotations:
          summary: "Qdrant vector DB is down"
          description: "Qdrant instance ({{ $labels.instance }}) is unreachable"

      - alert: QdrantStorageHigh
        expr: qdrant_storage_available_bytes / qdrant_storage_total_bytes < 0.1
        for: 5m
        labels:
          severity: critical
          component: vectordb
        annotations:
          summary: "Qdrant storage is running low"
          description: "Available storage: {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Agent Execution
      - alert: AgentFailureRateHigh
        expr: |
          rate(agent_execution_failures_total[5m]) /
          (rate(agent_execution_total[5m]) + 0.001) > 0.1
        for: 5m
        labels:
          severity: warning
          component: agent
        annotations:
          summary: "High agent failure rate"
          description: "Agent failure rate: {{ $value | humanizePercentage }}"

      - alert: AgentExecutionTimeout
        expr: increase(agent_execution_timeouts_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: agent
        annotations:
          summary: "Multiple agent execution timeouts"
          description: "{{ $value }} timeouts in the last 5 minutes"

      - alert: LLMConcurrencyHigh
        expr: llm_concurrent_requests > 500
        for: 3m
        labels:
          severity: warning
          component: llm
        annotations:
          summary: "LLM concurrent request count is high"
          description: "Concurrent LLM requests: {{ $value }}"

      - alert: LLMRateLimitExceeded
        expr: increase(llm_rate_limit_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
          component: llm
        annotations:
          summary: "LLM rate limit exceeded"
          description: "{{ $value }} rate limit errors in the last 5 minutes"

      # System Resources
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage: {{ $value | humanizePercentage }}"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage: {{ $value | humanizePercentage }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Low disk space"
          description: "Available disk space: {{ $value | humanizePercentage }}"

      # Workflow & Task Processing
      - alert: WorkflowExecutionStuck
        expr: |
          increase(workflow_execution_duration_seconds_bucket{le="+Inf"}[15m]) == 0 and
          workflow_execution_pending_count > 10
        for: 10m
        labels:
          severity: critical
          component: workflow
        annotations:
          summary: "Workflow execution appears stuck"
          description: "{{ $value }} workflows pending with no recent completions"

      - alert: TaskQueueBacklog
        expr: task_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
          component: taskqueue
        annotations:
          summary: "Task queue has significant backlog"
          description: "Current queue depth: {{ $value }}"

  - name: xagent_infrastructure
    interval: 60s
    rules:
      # Container Health
      - alert: ContainerRestarting
        expr: rate(container_last_seen{container_name=~"xagent.*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container is restarting frequently"
          description: "Container {{ $labels.container_name }} is restarting"

      # Prometheus Health
      - alert: PrometheusScrapeFailing
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Prometheus scrape is failing"
          description: "Prometheus target ({{ $labels.instance }}) is down"

      - alert: PrometheusStorageSpaceRunningOut
        expr: |
          predict_linear(
            prometheus_tsdb_symbol_table_size_bytes[2h],
            7200
          ) > prometheus_tsdb_symbol_table_size_bytes * 1.5
        for: 5m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Prometheus storage space running out"
          description: "Prometheus storage will run out of space in ~2 hours"

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: x-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      # P1-15 修正: compose 相对路径以本文件所在目录(monitoring/)为基准解析
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - ./recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - x-agent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: x-agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      # P1-15 修正: provisioning/dashboards 需要 provider 配置(yml), 裸 JSON 不会被加载;
      # 复用 deployment/grafana 的 provider 配置(其 options.path=/var/lib/grafana/dashboards)
      - ../deployment/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/main.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/x-agent.json:ro
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
    networks:
      - x-agent-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: x-agent-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - x-agent-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: x-agent-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - x-agent-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: x-agent-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://xagent:xagent@postgres:5432/xagent?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - x-agent-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: x-agent-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - x-agent-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: x-agent-postgres
    environment:
      POSTGRES_USER: xagent
      POSTGRES_PASSWORD: xagent
      POSTGRES_DB: xagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - x-agent-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: x-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - x-agent-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: x-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - x-agent-network
    restart: unless-stopped

  # Elasticsearch - Log storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: x-agent-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - x-agent-network
    restart: unless-stopped

  # Logstash - Log processing and forwarding
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: x-agent-logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - /var/log/xagent:/var/log/xagent:ro
    ports:
      - "5000:5000"
      - "5001:5001"
      - "8080:8080"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    networks:
      - x-agent-network
    restart: unless-stopped
    depends_on:
      - elasticsearch

  # Kibana - Log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: x-agent-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - x-agent-network
    restart: unless-stopped
    depends_on:
      - elasticsearch

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: x-agent-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "14268:14268"
      - "14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - x-agent-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  postgres_data:
  redis_data:
  qdrant_data:
  elasticsearch_data:

networks:
  x-agent-network:
    driver: bridge

apiVersion: v1
kind: Secret
metadata:
  name: xagent-secrets
  namespace: xagent
type: Opaque
stringData:
  # Database credentials
  DB_USER: "xagent"
  DB_PASSWORD: "change-me-in-production"
  # Redis password
  REDIS_PASSWORD: "change-me-in-production"
  # Qdrant API key
  QDRANT_API_KEY: "change-me-in-production"
  # Neo4j password
  NEO4J_PASSWORD: "change-me-in-production"
  # Application secret
  SECRET_KEY: "change-me-in-production-use-strong-random-key"

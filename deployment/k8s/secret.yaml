apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: xagent-secrets
  namespace: xagent
  labels:
    app.kubernetes.io/name: xagent
    app.kubernetes.io/component: secrets
  annotations:
    xagent.io/secret-source: owner-managed-external-store
    xagent.io/secret-contract: required-before-deploy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: xagent-production-secret-store
    kind: ClusterSecretStore
  target:
    name: xagent-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: xagent
          app.kubernetes.io/component: runtime-secret
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: xagent/production/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: xagent/production/redis
        property: password
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: xagent/production/qdrant
        property: apiKey
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: xagent/production/neo4j
        property: password
    - secretKey: SECRET_KEY
      remoteRef:
        key: xagent/production/application
        property: secretKey

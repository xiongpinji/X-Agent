apiVersion: v1
kind: ConfigMap
metadata:
  name: xagent-config
  namespace: xagent
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  API_WORKERS: "4"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  # Database
  DB_NAME: "xagent_db"
  DB_USER: "xagent"
  DB_PORT: "5432"
  # Redis
  REDIS_PORT: "6379"
  # Qdrant
  QDRANT_PORT: "6333"
  # Neo4j
  NEO4J_PORT: "7687"
  NEO4J_USER: "neo4j"

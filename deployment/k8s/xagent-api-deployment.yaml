apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-api
  namespace: xagent
  labels:
    app: xagent-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xagent-api
  template:
    metadata:
      labels:
        app: xagent-api
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xagent-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: xagent-api
        image: xagent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # P0-03: 应用配置统一 XAGENT_ 前缀(对照 backend/app/settings.py, env_prefix="XAGENT_")
        - name: XAGENT_APP_MODE
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_APP_MODE
        # LOG_LEVEL 由 backend/app/monitoring 与 core/config.py LogSettings(LOG_ 前缀)直接读取, 保持原名
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: LOG_LEVEL
        - name: XAGENT_DEBUG
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_DEBUG
        - name: XAGENT_API_WORKERS
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_API_WORKERS
        - name: XAGENT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: XAGENT_JWT_SECRET
        - name: XAGENT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: XAGENT_ENCRYPTION_KEY
        # 以下为组合 URL 用的辅助变量; 必须先于 $(VAR) 引用定义(K8s 按顺序展开)
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_NAME
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: REDIS_PASSWORD
        - name: XAGENT_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: XAGENT_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: XAGENT_QDRANT_URL
          value: "http://qdrant:6333"
        - name: XAGENT_QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: QDRANT_API_KEY
        # Neo4j (预留: 后端当前未消费 NEO4J 配置)
        - name: XAGENT_NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: XAGENT_NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: NEO4J_USER
        - name: XAGENT_NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: NEO4J_PASSWORD
        # P0-02: CELERY_BROKER_URL/CELERY_RESULT_BACKEND 已移除(后端无 Celery 应用)
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            # P0: readiness 用 /ready 深探针(检查下游依赖), liveness 保持 /health 浅探针
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: xagent-api
  namespace: xagent
  labels:
    app: xagent-api
spec:
  selector:
    app: xagent-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xagent-api-hpa
  namespace: xagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xagent-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

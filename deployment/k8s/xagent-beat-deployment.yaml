apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-beat
  namespace: xagent
  labels:
    app: xagent-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xagent-beat
  template:
    metadata:
      labels:
        app: xagent-beat
    spec:
      containers:
      - name: xagent-beat
        image: xagent:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - backend.app.workflow_worker
        - beat
        - --loglevel=info
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: ENVIRONMENT
        - name: XAGENT_APP_MODE
          value: "production"
        - name: XAGENT_MODE
          value: "production"
        - name: XAGENT_REQUIRE_API_KEY
          value: "true"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: XAGENT_DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_NAME
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: XAGENT_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: REDIS_PASSWORD
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: XAGENT_QDRANT_URL
          value: "http://qdrant:6333"
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-beat
  namespace: xagent
  labels:
    app: xagent-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xagent-beat
  template:
    metadata:
      labels:
        app: xagent-beat
    spec:
      containers:
      - name: xagent-beat
        image: xagent:latest
        imagePullPolicy: Always
        # P0-02: 后端无 Celery 应用; beat 角色当前与 worker 同为 asyncio 轮询进程,
        # 直接以 python -m 启动, 待真 Celery 返工后再拆分调度器
        command:
        - python
        - -m
        - backend.app.workflow_worker
        env:
        # P0-03: 应用配置统一 XAGENT_ 前缀(对照 backend/app/settings.py, env_prefix="XAGENT_")
        - name: XAGENT_APP_MODE
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_APP_MODE
        # LOG_LEVEL 由 backend/app/monitoring 与 core/config.py LogSettings(LOG_ 前缀)直接读取, 保持原名
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: LOG_LEVEL
        # 以下为组合 URL 用的辅助变量; 必须先于 $(VAR) 引用定义(K8s 按顺序展开)
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_NAME
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: REDIS_PASSWORD
        - name: XAGENT_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: XAGENT_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        # P0-02: CELERY_BROKER_URL/CELERY_RESULT_BACKEND 已移除(后端无 Celery 应用)
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}

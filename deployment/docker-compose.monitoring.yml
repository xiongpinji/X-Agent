version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: xagent-prometheus
    ports:
      - "9090:9090"
    volumes:
      # P1-15 修正: compose 相对路径以本文件所在目录(deployment/)为基准解析
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - xagent-monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: xagent-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - xagent-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: xagent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      # P1-15 修正: Grafana provisioning 要求 provider 配置在
      # provisioning/{dashboards,datasources}/*.yml 子路径; 原整目录挂载会把
      # yml 落到 provisioning 根(被忽略), 且 dashboards 目录挂载会遮蔽 provider 配置
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/main.yml:ro
      - ./grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/main.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - xagent-monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: xagent-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - xagent-monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  xagent-monitoring:
    driver: bridge

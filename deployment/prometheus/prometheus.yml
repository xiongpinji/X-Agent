global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'xagent-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'xagent-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/api/v1/metrics/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'xagent-health'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/api/v1/health/detailed'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

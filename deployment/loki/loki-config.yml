# Loki Configuration for X-Agent
# Single-node setup suitable for development and staging
# For production clustering, see: https://grafana.com/docs/loki/latest/fundamentals/architecture/
#
# Key tuning parameters:
#   - max_cache_freshness_period: 1m (cache window)
#   - max_look_back_period: 30d (maximum query time range)
#   - retention_deletes_enabled: true (auto-delete old chunks)

auth_enabled: false

ingester:
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  max_chunk_age: 1h
  chunk_encoding: snappy
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  max_cache_freshness_period: 1m
  max_look_back_period: 30d
  max_streams_per_user: 10000

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

server:
  http_listen_port: 3100
  log_level: info

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    shared_store: filesystem
    cache_location: /loki/boltdb-shipper-cache
  filesystem:
    directory: /loki/chunks

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # 30 days

query_range:
  align_queries_with_step: true
  max_cache_freshness_period: 10m
  cache_results: true
  results_cache:
    cache:
      enable_fifocache: true
      default_validity: 1m
      background:
        writeback_goroutines: 10
        writeback_chan_size: 10000

querier:
  query_timeout: 5m
  worker_concurrency: 10

# Promtail Configuration for X-Agent
# Log collection from:
#   1. Docker containers (with xagent=true label)
#   2. System logs (/var/log)
#   3. Application logs in /var/log/xagent
#
# Scraped data is labeled with service name, environment, and pod for Loki queries
# Example query: {service="xagent-backend"} | json

server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

# All logs are shipped to the Loki service on port 3100
clients:
  - url: http://loki:3100/loki/api/v1/push
    # Batch settings to optimize throughput
    batch_size: 1048576        # 1 MB
    batch_timeout: 1s

# Configuration to scrape logs from Docker containers
# Filters containers by label "xagent=true"
scrape_configs:
  # === Docker Container Logs ===
  - job_name: docker
    static_configs:
      - labels:
          job: docker
          env: ${XAGENT_ENV:-local}
          __path__: /var/lib/docker/containers/*/*-json.log
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      # Extract service label if present
      - source_labels: ['__meta_docker_container_label_xagent_service']
        target_label: 'service'
      # Extract environment label
      - source_labels: ['__meta_docker_container_label_xagent_env']
        target_label: 'environment'
        default: 'local'
      # Only scrape containers with xagent=true label
      - source_labels: ['__meta_docker_container_label_xagent']
        regex: '^true$'
        action: keep

  # === System Logs ===
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          service: host
          env: ${XAGENT_ENV:-local}
          __path__: /var/log/syslog
    pipeline_stages:
      # Parse syslog timestamp
      - match:
          selector: '{job="syslog"}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\w+ +\d+ \d+:\d+:\d+) (?P<hostname>[\w-]+) (?P<program>[\w-]+(?:\[\d+\])?): (?P<message>.*)$'
            - timestamp:
                source: timestamp
                format: 'Jan 2 15:04:05'

  # === X-Agent Application Logs ===
  - job_name: xagent-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: xagent-app
          service: xagent-backend
          env: ${XAGENT_ENV:-local}
          __path__: /var/log/xagent/*.log
    pipeline_stages:
      # Extract JSON fields if log is JSON
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            service: service
      # Parse ISO 8601 timestamp
      - timestamp:
          source: timestamp
          format: 'RFC3339Nano'
          fallback_formats:
            - 'RFC3339'
            - '2006-01-02T15:04:05.999Z07:00'
      # Add labels from parsed JSON
      - labels:
          level:
          logger:
          service:

  # === PostgreSQL Logs (if co-located) ===
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          service: postgres
          env: ${XAGENT_ENV:-local}
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>[A-Z]+)\] (?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      - labels:
          level:

  # === Redis Logs (if co-located) ===
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          service: redis
          env: ${XAGENT_ENV:-local}
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<pid>\d+):(?P<level>[A-Za-z]) (?P<timestamp>\d{2} \w+ \d{2}:\d{2}:\d{2}\.\d+) (?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: '02 Jan 15:04:05.999'
          year: '2006'
      - labels:
          level:

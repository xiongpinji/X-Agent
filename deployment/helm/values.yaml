# Default values for xagent
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: production
  logLevel: INFO
  debug: false

# Image configuration
image:
  repository: xagent
  tag: latest
  pullPolicy: Always

# API Server configuration
api:
  enabled: true
  replicas: 3
  port: 8000
  workers: 4
  # P1-16: 优雅停机 —— 宽限期(>=60) + preStop sleep 秒数
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Workflow Worker configuration (P0-02: 当前为 asyncio 轮询进程 python -m backend.app.workflow_worker,
# 非 Celery; celery 依赖保留但未使用, 待真 Celery 返工)
worker:
  enabled: true
  replicas: 2
  concurrency: 4
  terminationGracePeriodSeconds: 120
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

# Workflow Scheduler (原 beat 角色) configuration (P0-02: 非 Celery, 待真 Celery 返工后再拆分调度器)
beat:
  enabled: true
  replicas: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

# PostgreSQL configuration
# enabled=false 时依赖外部数据库, 必须设置 external.postgresHost (见 templates/_helpers.tpl)
postgres:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  storage: 10Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Redis configuration
# enabled=false 时依赖外部 Redis, 必须设置 external.redisHost
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 5Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Qdrant configuration
# enabled=false 时依赖外部 Qdrant, 必须设置 external.qdrantHost
qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  port: 6333
  grpcPort: 6334
  storage: 20Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Neo4j configuration
# enabled=false 时依赖外部 Neo4j, 必须设置 external.neo4jHost
neo4j:
  enabled: true
  image: neo4j:5-community
  port: 7687
  httpPort: 7474
  user: neo4j
  storage: 15Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# 外部依赖端点(仅当对应组件 enabled=false 时使用; 组件启用时忽略)
# 商用生产建议: 数据库类组件使用云厂商托管实例, 将 postgres/redis/qdrant/neo4j 的
# enabled 设为 false 并在此填写外部端点, 见 deployment/helm/README.md
external:
  postgresHost: ""
  redisHost: ""
  qdrantHost: ""
  neo4jHost: ""

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.xagent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: xagent-tls
      hosts:
        - api.xagent.example.com

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Secrets (should be overridden in production)
# P0-03: jwtSecret/encryptionKey 对应容器内 XAGENT_JWT_SECRET/XAGENT_ENCRYPTION_KEY,
# 生产模式必须为 >=32 字符且含大写字母与数字的强随机值
secrets:
  dbUser: xagent
  dbPassword: change-me-in-production
  redisPassword: change-me-in-production
  qdrantApiKey: change-me-in-production
  neo4jPassword: change-me-in-production
  jwtSecret: change-me-in-production-use-strong-random-key
  encryptionKey: change-me-in-production-use-strong-random-key

# Database configuration
database:
  name: xagent_db
  port: 5432

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000

# Backup configuration (P1-17: 渲染为 K8s CronJob, 脚本见 deployment/backup/backup.sh)
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days (脚本内 RETENTION_DAYS)
  # 备份镜像由 deployment/backup/Dockerfile 构建, 含 pg_dump/redis-cli/curl/jq
  image:
    repository: xagent-backup
    tag: latest
    pullPolicy: IfNotPresent
  # 备份落盘的 PVC 大小
  storage: 20Gi
  # 可选: 上传到 S3
  s3:
    enabled: false
    bucket: ""
    region: us-east-1
  # 优雅停机(CronJob Pod; 批任务正常结束时 preStop 不触发)
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  # 超时兜底, 防止备份卡死占用锁
  activeDeadlineSeconds: 3600

# X-Agent Helm Chart - Development/Default Values
# For other environments, use values-staging.yaml or values-production.yaml

replicaCount: 1

image:
  repository: x-agent/x-agent
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: x-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: x-agent-tls
      hosts:
        - x-agent.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Health probe settings
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment configuration
env:
  LOG_LEVEL: info
  DEBUG: "false"
  ENVIRONMENT: development

# Configuration from ConfigMap
configMap:
  enabled: true
  data:
    mcp_servers: |
      - name: github
        command: python
        args: ["-m", "mcp.server.github"]
      - name: filesystem
        command: python
        args: ["-m", "mcp.server.filesystem"]

# Secrets (create externally in production)
secrets:
  enabled: false
  # In production, use external secret management
  # externalSecrets:
  #   enabled: true
  #   backend: vault
  #   vaultServer: https://vault.example.com

# Database configuration
database:
  enabled: true
  type: postgresql
  host: postgres.default.svc.cluster.local
  port: 5432
  name: xagent
  poolSize: 10
  maxOverflow: 20
  # password and user should be set via secrets/environment

# Redis cache configuration
redis:
  enabled: true
  host: redis.default.svc.cluster.local
  port: 6379
  db: 0
  password: null

# Observability
observability:
  enabled: true
  metrics:
    enabled: true
    port: 8000
  traces:
    enabled: true
    # Langfuse configuration
    endpoint: "https://api.langfuse.com"
  logs:
    level: info

# Volume mounts
persistence:
  enabled: false
  storageClassName: "standard"
  size: 10Gi
  mountPath: /data

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

# HorizontalPodAutoscaler
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

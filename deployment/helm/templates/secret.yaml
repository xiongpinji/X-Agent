apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xagent.fullname" . }}-secrets
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
type: Opaque
data:
  # These values should be provided via:
  # helm install xagent . --set-string secrets.databaseUrl="postgresql://..." --set-string secrets.apiKey="..."
  {{- if .Values.secrets.enabled }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc }}
  redis-url: {{ .Values.secrets.redisUrl | b64enc }}
  api-key: {{ .Values.secrets.apiKey | b64enc }}
  {{- if .Values.observability.traces.enabled }}
  langfuse-public-key: {{ .Values.secrets.langfusePublicKey | b64enc }}
  langfuse-secret-key: {{ .Values.secrets.langfuseSecretKey | b64enc }}
  {{- end }}
  {{- else }}
  # Placeholder values - MUST be replaced in production
  database-url: cG9zdGdyZXM6Ly9sb2NhbGhvc3Q6NTQzMi94YWdlbnQ=
  redis-url: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==
  api-key: Y2hhbmdlLW1l
  langfuse-public-key: cGstemF0ZW5hcg==
  langfuse-secret-key: c2stdGVzdA==
  {{- end }}

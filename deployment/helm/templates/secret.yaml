{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xagent.secretName" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
type: Opaque
data:
  # For staging/production, prefer a pre-created Kubernetes Secret and set:
  # secrets.enabled=true, secrets.create=false, secrets.existingSecretName=xagent-secrets.
  {{- if .Values.secrets.enabled }}
  database-url: {{ required "secrets.databaseUrl is required when secrets.enabled=true" .Values.secrets.databaseUrl | b64enc }}
  redis-url: {{ required "secrets.redisUrl is required when secrets.enabled=true" .Values.secrets.redisUrl | b64enc }}
  api-key: {{ required "secrets.apiKey is required when secrets.enabled=true" .Values.secrets.apiKey | b64enc }}
  jwt-secret: {{ required "secrets.jwtSecret is required when secrets.enabled=true" .Values.secrets.jwtSecret | b64enc }}
  encryption-key: {{ required "secrets.encryptionKey is required when secrets.enabled=true" .Values.secrets.encryptionKey | b64enc }}
  audit-hmac-secret: {{ required "secrets.auditHmacSecret is required when secrets.enabled=true" .Values.secrets.auditHmacSecret | b64enc }}
  {{- if .Values.observability.traces.enabled }}
  langfuse-public-key: {{ required "secrets.langfusePublicKey is required when observability.traces.enabled=true" .Values.secrets.langfusePublicKey | b64enc }}
  langfuse-secret-key: {{ required "secrets.langfuseSecretKey is required when observability.traces.enabled=true" .Values.secrets.langfuseSecretKey | b64enc }}
  {{- end }}
  {{- if .Values.observability.errors.enabled }}
  sentry-dsn: {{ required "secrets.sentryDsn is required when observability.errors.enabled=true" .Values.secrets.sentryDsn | b64enc }}
  {{- end }}
  {{- if eq (.Values.workflowEvents.backend | default "local") "rabbitmq" }}
  workflow-event-rabbitmq-url: {{ required "secrets.workflowEventRabbitmqUrl is required when workflowEvents.backend=rabbitmq" .Values.secrets.workflowEventRabbitmqUrl | b64enc }}
  {{- end }}
  {{- else }}
  # Placeholder values - MUST be replaced in production
  database-url: cG9zdGdyZXM6Ly9sb2NhbGhvc3Q6NTQzMi94YWdlbnQ=
  redis-url: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==
  api-key: Y2hhbmdlLW1l
  jwt-secret: Y2hhbmdlLXRoaXMtdG8tYS1yYW5kb20tNjQtY2hhci1zdHJpbmc=
  encryption-key: Y2hhbmdlLXRoaXMtdG8tMzItY2hhci1oZXgtc3RyaW5n
  audit-hmac-secret: cmVwbGFjZS13aXRoLXJhbmRvbS1wcm9kdWN0aW9uLXNlY3JldA==
  langfuse-public-key: cGstemF0ZW5hcg==
  langfuse-secret-key: c2stdGVzdA==
  sentry-dsn: ""
  workflow-event-rabbitmq-url: ""
  {{- end }}
{{- end }}

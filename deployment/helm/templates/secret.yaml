apiVersion: v1
kind: Secret
metadata:
  name: xagent-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  # P0-03: 应用密钥统一 XAGENT_ 前缀(对照 backend/app/settings.py);
  # 生产模式下两者必须为非默认强随机值(>=32字符且含大写+数字), 否则 Settings 校验失败
  XAGENT_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  XAGENT_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}

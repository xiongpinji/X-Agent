apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xagent.fullname" . }}-secrets
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
type: Opaque
data:
  # These values should be provided via:
  # helm install xagent . --set-string secrets.databaseUrl="postgresql://..." --set-string secrets.apiKey="..."
  {{- if .Values.secrets.enabled }}
  database-url: {{ .Values.secrets.databaseUrl | default "" | b64enc }}
  redis-url: {{ .Values.secrets.redisUrl | default "" | b64enc }}
  api-key: {{ .Values.secrets.apiKey | default "" | b64enc }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default "" | b64enc }}
  encryption-key: {{ .Values.secrets.encryptionKey | default "" | b64enc }}
  audit-hmac-secret: {{ .Values.secrets.auditHmacSecret | default "" | b64enc }}
  {{- if .Values.observability.traces.enabled }}
  langfuse-public-key: {{ .Values.secrets.langfusePublicKey | default "" | b64enc }}
  langfuse-secret-key: {{ .Values.secrets.langfuseSecretKey | default "" | b64enc }}
  {{- end }}
  {{- if .Values.observability.errors.enabled }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | default "" | b64enc }}
  {{- end }}
  {{- if eq (.Values.workflowEvents.backend | default "local") "rabbitmq" }}
  workflow-event-rabbitmq-url: {{ .Values.secrets.workflowEventRabbitmqUrl | default "" | b64enc }}
  {{- end }}
  {{- else }}
  # Placeholder values - MUST be replaced in production
  database-url: cG9zdGdyZXM6Ly9sb2NhbGhvc3Q6NTQzMi94YWdlbnQ=
  redis-url: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==
  api-key: Y2hhbmdlLW1l
  jwt-secret: Y2hhbmdlLXRoaXMtdG8tYS1yYW5kb20tNjQtY2hhci1zdHJpbmc=
  encryption-key: Y2hhbmdlLXRoaXMtdG8tMzItY2hhci1oZXgtc3RyaW5n
  audit-hmac-secret: cmVwbGFjZS13aXRoLXJhbmRvbS1wcm9kdWN0aW9uLXNlY3JldA==
  langfuse-public-key: cGstemF0ZW5hcg==
  langfuse-secret-key: c2stdGVzdA==
  sentry-dsn: ""
  workflow-event-rabbitmq-url: ""
  {{- end }}

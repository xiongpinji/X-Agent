apiVersion: v1
kind: ConfigMap
metadata:
  name: xagent-config
  namespace: {{ .Release.Namespace }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  DEBUG: {{ .Values.global.debug | quote }}
  API_WORKERS: {{ .Values.api.workers | quote }}
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  QDRANT_PORT: {{ .Values.qdrant.port | quote }}
  NEO4J_PORT: {{ .Values.neo4j.port | quote }}
  NEO4J_USER: {{ .Values.neo4j.user | quote }}

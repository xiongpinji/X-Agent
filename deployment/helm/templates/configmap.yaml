apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xagent.fullname" . }}-config
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
data:
  {{- with .Values.configMap.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  config.yaml: |
    log_level: {{ .Values.env.LOG_LEVEL | default "info" }}
    debug: {{ .Values.env.DEBUG | default "false" }}
    environment: {{ .Values.env.ENVIRONMENT | default "development" }}
    database:
      host: {{ .Values.database.host }}
      port: {{ .Values.database.port }}
      name: {{ .Values.database.name }}
      pool_size: {{ .Values.database.poolSize }}
      max_overflow: {{ .Values.database.maxOverflow }}
    redis:
      host: {{ .Values.redis.host }}
      port: {{ .Values.redis.port }}
      db: {{ .Values.redis.db }}
    {{- if .Values.observability.enabled }}
    observability:
      metrics:
        enabled: {{ .Values.observability.metrics.enabled }}
      traces:
        enabled: {{ .Values.observability.traces.enabled }}
        endpoint: {{ .Values.observability.traces.endpoint }}
      logs:
        level: {{ .Values.observability.logs.level }}
    {{- end }}

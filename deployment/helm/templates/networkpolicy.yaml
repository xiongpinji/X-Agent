{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xagent.fullname" . }}
  labels:
    {{- include "xagent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xagent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound to any (can be restricted in production)
    - to:
        - podSelector: {}
{{- end }}

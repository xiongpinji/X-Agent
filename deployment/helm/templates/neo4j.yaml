{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: {{ .Release.Namespace }}
  labels:
    app: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # P1-16: 优雅停机 —— 宽限期默认 60s, 留给事务关闭与存储 flush
      terminationGracePeriodSeconds: {{ .Values.neo4j.terminationGracePeriodSeconds | default 60 }}
      containers:
      - name: neo4j
        image: {{ .Values.neo4j.image }}
        lifecycle:
          # P1-16: neo4j:5-community 基于 debian, 含 /bin/sh 与 sleep
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep {{ .Values.neo4j.preStopSleepSeconds | default 5 }}
        ports:
        - containerPort: {{ .Values.neo4j.port }}
          name: bolt
        - containerPort: {{ .Values.neo4j.httpPort | default 7474 }}
          name: http
        env:
        - name: NEO4J_AUTH
          value: "$(NEO4J_USER)/$(NEO4J_PASSWORD)"
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: NEO4J_PASSWORD
        - name: NEO4J_server_memory_heap_initial__size
          value: "512m"
        - name: NEO4J_server_memory_heap_max__size
          value: "1g"
        resources:
          {{- toYaml .Values.neo4j.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.neo4j.httpPort | default 7474 }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.neo4j.httpPort | default 7474 }}
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: neo4j-logs
          mountPath: /var/lib/neo4j/logs
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: neo4j-logs
        persistentVolumeClaim:
          claimName: neo4j-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: neo4j
  ports:
  - port: {{ .Values.neo4j.port }}
    targetPort: {{ .Values.neo4j.port }}
    name: bolt
  - port: {{ .Values.neo4j.httpPort | default 7474 }}
    targetPort: {{ .Values.neo4j.httpPort | default 7474 }}
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.neo4j.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-logs-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
{{- end }}

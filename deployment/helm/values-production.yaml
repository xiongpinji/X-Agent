# X-Agent Helm Chart - Production Environment Values
# Production: 3+ replicas, strict limits, real domain, external secrets, high availability

global:
  environment: production

replicaCount: 3

image:
  repository: x-agent/x-agent
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets:
  - name: registry-credentials

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: api.x-agent.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: x-agent-prod-tls
      hosts:
        - api.x-agent.dev

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - xagent
        topologyKey: kubernetes.io/hostname

env:
  LOG_LEVEL: warn
  DEBUG: "false"
  ENVIRONMENT: production

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

database:
  host: postgres.production.svc.cluster.local
  port: 5432
  name: xagent_prod
  poolSize: 20
  maxOverflow: 40
  sslMode: require

redis:
  host: redis.production.svc.cluster.local
  password: null  # Set via secrets

observability:
  enabled: true
  metrics:
    enabled: true
    retention: 30d
  traces:
    enabled: true
    endpoint: "https://api.langfuse.com"
    samplingRate: 0.1
  logs:
    level: warn
    format: json

persistence:
  enabled: true
  size: 100Gi
  storageClassName: "fast-ssd"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

secrets:
  enabled: true
  externalSecrets:
    enabled: true
    backend: vault
    vaultServer: https://vault.production.example.com
    vaultPath: secret/xagent/prod

monitoring:
  enabled: true
  alerts:
    enabled: true
  slo:
    availability: 99.9
    latency_p99: 500

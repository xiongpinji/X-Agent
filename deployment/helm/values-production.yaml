# Helm values for production environment
global:
  environment: production
  logLevel: WARNING
  debug: false

image:
  repository: ""
  tag: ""
  pullPolicy: Always

api:
  enabled: true
  # Realtime collaboration is process-local in the first commercial release.
  # Keep a single API process until a distributed stream backend is available.
  replicas: 1
  port: 8000
  workers: 1
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicas: 4
  concurrency: 4
  terminationGracePeriodSeconds: 120
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

beat:
  enabled: true
  replicas: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

# 商用生产必须使用外部持久化服务。端点留空会使 Helm 渲染直接失败。
postgres:
  enabled: false
  image: pgvector/pgvector:pg16
  port: 5432
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

redis:
  enabled: false
  image: redis:7-alpine
  port: 6379
  storage: 10Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

qdrant:
  enabled: false
  image: qdrant/qdrant:latest
  port: 6333
  grpcPort: 6334
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

neo4j:
  enabled: false
  image: neo4j:5-community
  port: 7687
  httpPort: 7474
  user: neo4j
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# 外部依赖端点(仅当对应组件 enabled=false 时必填)
external:
  postgresHost: ""
  redisHost: ""
  qdrantHost: ""
  neo4jHost: ""

# P1 新增应用环境变量
appEnv:
  workflowStoreBackend: db
  memoryBackend: postgres
  traceBackend: postgres
  adminStoreBackend: postgres
  feedbackStoreBackend: postgres
  runStoreBackend: postgres
  auditStoreBackend: postgres
  neo4jEnabled: false
  pythonUtf8: "1"

# SSO / 身份认证配置 (P1)
sso:
  saml:
    enabled: false
    entityId: ""
    acsUrl: ""
    idpMetadataUrl: ""
    idpEntityId: ""
    nameIdFormat: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
  ldap:
    enabled: false
    serverUrl: ""
    baseDn: ""
    bindDn: ""
    bindPassword: ""
    userSearchFilter: "(uid={username})"
    useTls: true
  webauthn:
    enabled: false
    rpId: ""
    rpName: "X-Agent"
    origin: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: xagent-tls
      hosts:
        - ""

service:
  type: ClusterIP
  port: 8000

secrets:
  existingSecret: ""

migration:
  enabled: true
  verifiedBackupId: ""
  timeoutSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400

artifacts:
  existingClaim: ""
  mountPath: /var/lib/xagent/run-artifacts

runtime:
  mountPath: /var/lib/xagent

database:
  name: xagent_db
  port: 5432

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  storage: 100Gi
  s3:
    enabled: true
    bucket: ""
    region: us-east-1
  serviceAccount:
    roleArn: ""
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  activeDeadlineSeconds: 7200

# Helm values for production environment
global:
  environment: production
  logLevel: WARNING
  debug: false

image:
  repository: your-registry/xagent
  tag: latest
  pullPolicy: Always

api:
  enabled: true
  replicas: 5
  port: 8000
  workers: 4
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicas: 4
  concurrency: 4
  terminationGracePeriodSeconds: 120
  preStopSleepSeconds: 10
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

beat:
  enabled: true
  replicas: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

# 生产建议: 数据库类组件改用云厂商托管实例 —— 将对应 enabled 设为 false,
# 并在 external.* 填写外部端点。默认仍启用集群内单副本(适合演示/中小规模)。
postgres:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 10Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  port: 6333
  grpcPort: 6334
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

neo4j:
  enabled: true
  image: neo4j:5-community
  port: 7687
  httpPort: 7474
  user: neo4j
  storage: 50Gi
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# 外部依赖端点(仅当对应组件 enabled=false 时必填)
external:
  postgresHost: ""
  redisHost: ""
  qdrantHost: ""
  neo4jHost: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.xagent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: xagent-tls
      hosts:
        - api.xagent.example.com

service:
  type: ClusterIP
  port: 8000

secrets:
  dbUser: xagent
  dbPassword: CHANGE_ME_IN_PRODUCTION
  redisPassword: CHANGE_ME_IN_PRODUCTION
  qdrantApiKey: CHANGE_ME_IN_PRODUCTION
  neo4jPassword: CHANGE_ME_IN_PRODUCTION
  # P0-03: 对应容器内 XAGENT_JWT_SECRET/XAGENT_ENCRYPTION_KEY (backend/app/settings.py)
  jwtSecret: CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_KEY
  encryptionKey: CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_KEY

database:
  name: xagent_db
  port: 5432

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30
  image:
    repository: your-registry/xagent-backup
    tag: latest
    pullPolicy: IfNotPresent
  storage: 100Gi
  s3:
    enabled: false
    bucket: ""
    region: us-east-1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  activeDeadlineSeconds: 7200

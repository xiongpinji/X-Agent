version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: xagent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - xagent-api
    networks:
      - xagent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: xagent-certbot
    volumes:
      - ./deployment/nginx/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew -q; sleep 12h & wait $${!}; done;'
    networks:
      - xagent
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  nginx-logs:
  certbot-www:

networks:
  xagent:
    driver: bridge

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: xagent-secrets
  namespace: production
  labels:
    app.kubernetes.io/name: xagent
    app.kubernetes.io/component: secrets
  annotations:
    xagent.io/secret-source: owner-managed-external-store
    xagent.io/secret-contract: production-url-style
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: xagent-production-secret-store
    kind: ClusterSecretStore
  target:
    name: xagent-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: xagent
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/part-of: production
  data:
    - secretKey: database-url
      remoteRef:
        key: xagent/production/runtime-urls
        property: database-url
    - secretKey: redis-url
      remoteRef:
        key: xagent/production/runtime-urls
        property: redis-url
    - secretKey: qdrant-url
      remoteRef:
        key: xagent/production/runtime-urls
        property: qdrant-url
    - secretKey: qdrant-api-key
      remoteRef:
        key: xagent/production/runtime-urls
        property: qdrant-api-key
    - secretKey: neo4j-uri
      remoteRef:
        key: xagent/production/runtime-urls
        property: neo4j-uri
    - secretKey: secret-key
      remoteRef:
        key: xagent/production/runtime-urls
        property: secret-key
    - secretKey: sentry-dsn
      remoteRef:
        key: xagent/production/runtime-urls
        property: sentry-dsn

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-canary
  namespace: production
  labels:
    app: xagent
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xagent
      version: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: xagent
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: xagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: xagent
        image: xagent:canary
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # P0-03: 应用配置统一 XAGENT_ 前缀(对照 backend/app/settings.py, env_prefix="XAGENT_")
        - name: XAGENT_APP_MODE
          value: "production"
        # LOG_LEVEL 由 backend/app/monitoring 与 core/config.py LogSettings(LOG_ 前缀)直接读取, 保持原名
        - name: LOG_LEVEL
          value: "INFO"
        - name: XAGENT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: database-url
        - name: XAGENT_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: redis-url
        - name: XAGENT_QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: qdrant-url
        # 预留: 后端当前未消费 NEO4J 配置
        - name: XAGENT_NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: neo4j-uri
        - name: XAGENT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: secret-key
        # 生产模式必需(Settings 校验); secret 需补充 encryption-key, 未提供时 Pod 将因校验失败而无法启动
        - name: XAGENT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: encryption-key
              optional: true
        - name: XAGENT_SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: sentry-dsn
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            # P0: readiness 用 /ready 深探针(检查下游依赖), liveness 保持 /health 浅探针
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: logs
          mountPath: /var/log/xagent
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xagent
              topologyKey: kubernetes.io/hostname

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-canary
  namespace: production
  labels:
    app: xagent
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xagent
      version: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: xagent
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: xagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: xagent
        image: xagent:canary
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: XAGENT_APP_MODE
          value: "production"
        - name: XAGENT_MODE
          value: "production"
        - name: XAGENT_REQUIRE_API_KEY
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: database-url
        - name: XAGENT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: redis-url
        - name: XAGENT_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: redis-url
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: qdrant-url
        - name: XAGENT_QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: qdrant-url
        - name: XAGENT_QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: qdrant-api-key
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: neo4j-uri
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: secret-key
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: sentry-dsn
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: logs
          mountPath: /var/log/xagent
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xagent
              topologyKey: kubernetes.io/hostname

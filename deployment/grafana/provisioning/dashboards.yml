apiVersion: 1

providers:
  - name: 'X-Agent Dashboards'
    orgId: 1
    folder: 'X-Agent'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # P1-15: 与 compose 挂载约定一致 —— provider 配置在 provisioning/,
      # 仪表盘 JSON 统一放 /var/lib/grafana/dashboards(避免 provider 扫描自身配置目录)
      path: /var/lib/grafana/dashboards

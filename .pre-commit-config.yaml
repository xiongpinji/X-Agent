# Pre-commit hooks for X-Agent Core
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-redis
        args: [--ignore-missing-imports, --no-strict-optional]
        files: ^backend/

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        files: ^backend/

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Gitleaks — full-history-capable secret scanner (defense in depth alongside
  # detect-secrets/detect-private-key). Catches API keys, tokens, and
  # high-entropy strings that the baseline-driven scanner may miss.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Deployment hardening gate — blocks commits that introduce weak default
  # passwords, :latest images, production --reload, or publicly exposed
  # databases into deployment manifests.
  - repo: local
    hooks:
      - id: deployment-hardening-gate
        name: deployment hardening gate
        entry: python scripts/security_deployment_gate.py
        language: system
        pass_filenames: false
        files: >-
          (?x)(
            ^docker-compose.*\.ya?ml$|
            ^deployment/.*\.(ya?ml|sh|yaml)$|
            ^monitoring/.*\.ya?ml$|
            ^templates/.*\.ya?ml$|
            ^\.env\.example$
          )

# 租户/用户级 token 配额（P1-08）。
# 开关与默认上限由环境变量控制：XAGENT_LLM_QUOTA_ENABLED /
# XAGENT_LLM_QUOTA_PERIOD / XAGENT_LLM_QUOTA_DEFAULT_TENANT_TOKENS /
# XAGENT_LLM_QUOTA_DEFAULT_USER_TOKENS；本节仅承载“按租户/用户”的覆盖表，
# 属于配置文件职责。token 计量累计存储在现有 cache 抽象（CacheManager）中，
# 不新建存储系统。
quota:
  # tenant_id -> 周期内 token 上限覆盖
  tenant_overrides: {}
  #   example-tenant: 5000000
  # user_id -> 周期内 token 上限覆盖（跨租户唯一时使用；同租户内更精确请用
  # TokenQuotaManager.set_user_quota(tenant, user, tokens)）
  user_overrides: {}
  #   user-42: 250000

# X-Agent LLM 模型档案（P1-08 路由收敛）
#
# 单一事实来源：智能路由（selector）、成本计量（TokenUsage 定价）均从本文件加载。
# - backend/app/core/llm/profiles.py 负责解析与校验；文件缺失时显式降级为
#   selector 内建默认档案并记录 warning（不会静默）；YAML 结构非法时抛出
#   ModelProfileLoadError（显式报错）。
# - 环境变量 XAGENT_LLM_MODEL_PROFILES_PATH 可指向其他档案文件。
#
# 字段说明：
#   name/provider        模型名与提供商（openai/deepseek/anthropic/ollama/mock）
#   cost_per_1k_*        USD / 1K tokens（本地模型为 0）
#   latency_ms           经验平均延迟，供 latency 策略排序
#   quality_score        0-100 主观质量分，供 performance 策略排序
#   max_tokens           上下文窗口
#   supported_tasks      见 selector.TaskType；空列表表示不限制
#   availability         可用率 0-1
#   rate_limit_rpm/tpm   速率限制（后端自检用）
version: 1

models:
  - name: gpt-4o
    provider: openai
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
    latency_ms: 800
    quality_score: 95
    max_tokens: 128000
    supported_tasks: [complex_reasoning, code_generation, analysis, creative]
    availability: 0.999
    rate_limit_rpm: 3500
    rate_limit_tpm: 90000

  - name: gpt-4o-mini

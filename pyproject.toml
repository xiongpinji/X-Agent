[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-agent-core"
# 版本号单一事实源: 全仓所有版本宣称(CHANGELOG/ROADMAP/README/前端/SDK)均以本字段为准
version = "0.3.0-alpha"
description = "X-Agent AgentCore - autonomous agent framework (commercial-readiness repair in progress, see commercial_audit/)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.2,<5.0.0",
    "cryptography>=46.0.0,<49.0.0",
    "fastapi>=0.115.0",
    "langfuse>=2.60.0",
    "httpx>=0.27.0",
    "ldap3>=2.9.1",
    "neo4j>=5.0.0",
    "openai>=1.100.0",
    "playwright>=1.48.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.28",
    "qdrant-client>=1.11.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["backend*", "cli*", "data*", "diagrams*", "packaging*", "scripts*", "templates*"]
exclude = ["frontend*"]

[project.scripts]
# NOTE: All CLI entry points rely on PYTHONUTF8=1 for correct handling of
# Chinese characters in paths/args on Windows. See scripts/fix_windows_encoding.ps1.
xagent = "cli.main:main_entry"
xagent-workflow-worker = "backend.app.workflow_worker:main"
xagent-desktop = "scripts.one_click_desktop:main"
xagent-package-desktop = "scripts.package_desktop:main"
xagent-open-frontend = "scripts.one_click_desktop:open_frontend"

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pyyaml>=6.0",
]
prod = [
    "psycopg[binary]>=3.2.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "nest-asyncio>=1.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.25.0,<0.26",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.10.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "locust>=2.20.0",
]
mcp = [
    "mcp>=1.0.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
enterprise = [
    "ldap3>=2.9.0",
    "webauthn>=2.0.0",
    "python3-saml>=1.16.0",
    "authlib>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --cov=backend --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
    /(
      # directories
      \.eggs
      | \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | build
      | dist
    )/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "playwright.*",
    "langfuse.*",
    "qdrant_client.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 10
max-locals = 20
max-branches = 15
max-statements = 50

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",       # line length handled by black
    "RUF001", "RUF002", "RUF003",  # 中文字符正常
    "B008",       # FastAPI Depends() in default args is standard pattern
    "RUF012",     # Mutable class attrs in Pydantic/dataclass models
    "E402",       # Conditional/deferred imports are intentional
    "E741",       # Ambiguous variable names acceptable in ML/math contexts
    "B904",       # raise-from: too many to fix, accept bare raise in except
    "SIM102",     # Nested if statements are sometimes clearer
    "RUF006",     # asyncio.create_task reference not always needed
    "SIM105",     # try-except-pass is explicit and clear
    "B027",       # Empty methods in ABCs are intentional (default no-op)
    "SIM115",     # open() without context manager: acceptable in specific patterns
    "SIM116",     # if-elif chains are sometimes clearer than dict dispatch
]
# 注: ruff 默认的 import 排序即与 black 兼容;
# 原 [tool.ruff.lint.isort] profile = "black" 已被 ruff 0.15 移除(unknown field), 删除以恢复启动。

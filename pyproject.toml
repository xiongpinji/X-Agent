[project]
name = "x-agent-core"
version = "0.1.0"
description = "Phase 0 MVP for X-Agent AgentCore"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "langfuse>=2.60.0",
    "httpx>=0.27.0",
    "openai>=1.100.0",
    "playwright>=1.48.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.11.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
xagent-workflow-worker = "backend.app.workflow_worker:main"
xagent-desktop = "scripts.one_click_desktop:main"
xagent-package-desktop = "scripts.package_desktop:main"
xagent-open-frontend = "scripts.one_click_desktop:open_frontend"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

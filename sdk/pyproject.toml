[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xagent-sdk"
version = "0.1.0"
description = "Python SDK for X-Agent — Enterprise Autonomous Agent Framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "X-Agent Contributors"}]
keywords = ["agent", "autonomous", "framework", "enterprise", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Repository = "https://github.com/X-Agent/sdk"
Documentation = "https://x-agent.readthedocs.io/sdk"
Issues = "https://github.com/X-Agent/issues"

[tool.hatch.version]
path = "xagent_sdk/__init__.py"

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

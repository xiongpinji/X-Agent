# Alembic Configuration File
# =======================
#
# This file contains configuration for Alembic database migration tool
# Alembic is a lightweight database migration tool for SQLAlchemy ORM
#
# Usage:
#   alembic init alembic
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head

[alembic]
# Path to the alembic script directory
script_location = backend/app/migrations/alembic

# Template file to use when creating new migrations
# file_template = %%(rev)s_%%(slug)s

# Sys.path path to make available to the code in the migrations
# Use this to include your project root so you can import application modules
sqlalchemy.url = sqlite:///./data/xagent.db

# Logging configuration
# Provide the SQLAlchemy log level (one of DEBUG, INFO, WARNING, ERROR, CRITICAL)
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.pool_recycle = 3600
sqlalchemy.pool_pre_ping = true

# Logging Configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

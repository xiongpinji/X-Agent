<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Agent Runner</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">X-Agent</p>
        <h1>Agent Runner</h1>
        <p class="subtitle">安全连接并运行一条可审计任务。</p>
      </header>

      <form id="login-form" class="panel">
        <h2>连接并登录</h2>
        <label>API 地址<input id="base-url" type="url" required placeholder="https://api.example.com"></label>
        <label>邮箱<input id="email" type="email" required autocomplete="username"></label>
        <label>密码<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">登录</button>
      </form>

      <section id="runner" class="panel hidden" aria-labelledby="runner-title">
        <div class="row between">
          <h2 id="runner-title">运行 Agent</h2>
          <button id="logout" class="secondary" type="button">退出</button>
        </div>
        <form id="run-form">
          <label>Agent ID<input id="agent-id" maxlength="128" value="default-agent" required></label>
          <label>任务<textarea id="task" maxlength="4096" rows="6" required></textarea></label>
          <button type="submit">开始运行</button>
        </form>
        <div id="run-card" class="run-card hidden">
          <p><strong>Run:</strong> <span id="run-id"></span></p>
          <p><strong>状态:</strong> <span id="run-status"></span></p>
          <p id="result"></p>
          <div class="row">
            <button id="refresh" class="secondary" type="button">刷新状态</button>
            <button id="cancel" class="danger" type="button">取消运行</button>
          </div>
        </div>
      </section>

      <p id="notice" class="notice hidden" role="status"></p>
      <p id="error" class="error hidden" role="alert"></p>
    </main>
    <script src="extension-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

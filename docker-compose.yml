services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      XAGENT_LLM_BACKEND: mock
      XAGENT_ENABLE_HIGH_RISK_TOOLS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload


# Source: xagent/templates/serviceaccount.yaml
# P1-15: api/worker/beat/canary 引用的 ServiceAccount; 应用当前不调用 K8s API,
# 不绑定任何 Role(最小权限), 未来需要时再补 RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xagent
  namespace: default
  labels:
    app: xagent
automountServiceAccountToken: false
---
# Source: xagent/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: xagent-secrets
  namespace: default
type: Opaque
stringData:
  DB_USER: "xagent"
  DB_PASSWORD: "change-me-in-production"
  REDIS_PASSWORD: "change-me-in-production"
  QDRANT_API_KEY: "change-me-in-production"
  NEO4J_PASSWORD: "change-me-in-production"
  # P0-03: 应用密钥统一 XAGENT_ 前缀(对照 backend/app/settings.py);
  # 生产模式下两者必须为非默认强随机值(>=32字符且含大写+数字), 否则 Settings 校验失败
  XAGENT_JWT_SECRET: "change-me-in-production-use-strong-random-key"
  XAGENT_ENCRYPTION_KEY: "change-me-in-production-use-strong-random-key"
---
# Source: xagent/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: xagent-config
  namespace: default
data:
  # P0-03: 应用配置统一 XAGENT_ 前缀(对照 backend/app/settings.py, env_prefix="XAGENT_", extra="ignore")
  XAGENT_APP_MODE: "production"
  # LOG_LEVEL 由 backend/app/monitoring 与 core/config.py LogSettings(LOG_ 前缀)直接读取, 保持原名
  LOG_LEVEL: "INFO"
  XAGENT_DEBUG: "false"
  XAGENT_API_WORKERS: "4"
  XAGENT_JWT_ALGORITHM: "HS256"
  XAGENT_JWT_EXPIRATION_HOURS: "24"
  # 以下为组合 URL 用的辅助变量(由 api-deployment 中 $(VAR) 引用), 非应用直读配置
  DB_NAME: "xagent_db"
  DB_PORT: "5432"
  DB_USER: "xagent"
  REDIS_PORT: "6379"
  QDRANT_PORT: "6333"
  NEO4J_PORT: "7687"
  NEO4J_USER: "neo4j"
  # P1: Python UTF-8 模式 (PEP 540)
  PYTHONUTF8: "1"
  # P1: 工作流存储后端
  XAGENT_WORKFLOW_STORE_BACKEND: "postgres"
  # P1: Neo4j 功能开关
  XAGENT_NEO4J_ENABLED: "false"
  # P1: SSO - SAML
  XAGENT_SAML_ENABLED: "false"
  XAGENT_SAML_ENTITY_ID: ""
  XAGENT_SAML_ACS_URL: ""
  XAGENT_SAML_IDP_METADATA_URL: ""
  XAGENT_SAML_IDP_ENTITY_ID: ""
  XAGENT_SAML_NAME_ID_FORMAT: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
  # P1: SSO - LDAP
  XAGENT_LDAP_ENABLED: "false"
  XAGENT_LDAP_SERVER_URL: ""
  XAGENT_LDAP_BASE_DN: ""
  XAGENT_LDAP_BIND_DN: ""
  XAGENT_LDAP_USER_SEARCH_FILTER: "(uid={username})"
  XAGENT_LDAP_USE_TLS: "true"
  # P1: SSO - WebAuthn
  XAGENT_WEBAUTHN_ENABLED: "false"
  XAGENT_WEBAUTHN_RP_ID: ""
  XAGENT_WEBAUTHN_RP_NAME: "X-Agent"
  XAGENT_WEBAUTHN_ORIGIN: ""

# Source: xagent/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-api
  namespace: default
  labels:
    app: xagent-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xagent-api
  template:
    metadata:
      labels:
        app: xagent-api
        version: v1
    spec:
      serviceAccountName: xagent
      # P1-16: 优雅停机 —— 宽限期默认 90s; preStop sleep 等待 Endpoints 摘除传播
      terminationGracePeriodSeconds: 90
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xagent-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: xagent-api
        image: "xagent:latest"
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        lifecycle:
          # P1-16: 镜像为 python:3.11-slim, 内置 /bin/sh 与 sleep
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        envFrom:
        - configMapRef:
            name: xagent-config
        - secretRef:
            name: xagent-secrets
        # P0-03: envFrom 仅注入零散 key, 应用实际读取的连接串在此由辅助变量组合
        # (envFrom 变量先于 env 处理, 可被 $(VAR) 引用)
        env:
        - name: XAGENT_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: XAGENT_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: XAGENT_QDRANT_URL
          value: "http://qdrant:6333"
        - name: XAGENT_NEO4J_URI
          value: "bolt://:7687"
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            # P0: readiness 用 /ready 深探针(检查下游依赖), liveness 保持 /health 浅探针
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---

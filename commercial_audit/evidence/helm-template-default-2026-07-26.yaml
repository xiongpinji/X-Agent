kind: Ingress
metadata:
  name: xagent-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.xagent.example.com"
      secretName: xagent-tls
  rules:
    - host: "api.xagent.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xagent-api
                port:
                  number: 8000

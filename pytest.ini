[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
# 注意: 覆盖率门禁 --cov-fail-under=70 不在默认 addopts 中(避免子集运行/--collect-only 时污染退出码);
# 该门禁已移至 pytest_comprehensive.ini, 或由 CI 在全量测试时显式传入 --cov-fail-under=70。
# -n auto: 默认并行执行 (pytest-xdist), 2353 个单元测试串行会因慢导入挂起;
# 使用 --no-cov 可跳过覆盖率以加速本地迭代。
addopts =
    -n auto
    --timeout=30
    --strict-markers
    -q
    --tb=short

# Test markers
markers =
    e2e: end-to-end contract tests
    runtime: runtime shape and helper tests
    contracts: import and interface contract tests
    legacy: historical regression tests
    unit: unit tests
    integration: integration tests
    performance: performance tests
    slow: slow running tests
    smoke: smoke tests
    security: security tests
    mcp: MCP protocol and integration tests
    asyncio: async tests
    benchmark: performance benchmark tests
    bottleneck_analysis: bottleneck analysis tests
    load_test: load testing
    stability_test: stability testing
    stress_test: stress testing
    flaky: flaky tests that may intermittently fail
    timeout: tests with custom timeout
    local_perf: in-process performance tests (no live server needed)

# Timeout for tests (in seconds)
timeout = 30
timeout_method = thread

# Minimum Python version
minversion = 7.0

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::ResourceWarning:asyncio
    ignore::pytest.PytestUnraisableExceptionWarning

[coverage:run]
branch = True
source = backend
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    if 0:
    if False:
    class .*\bProtocol\):
    @overload

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

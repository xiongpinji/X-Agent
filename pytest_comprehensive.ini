[pytest]
# Pytest configuration for comprehensive test suite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    api: API endpoint tests
    performance: Performance and benchmark tests
    boundary: Boundary condition tests
    exception: Exception handling tests
    async: Asynchronous operation tests
    slow: Tests that take longer to execute
    security: Security-related tests
    memory: Memory operation tests
    browser: Browser automation tests
    workflow: Workflow execution tests
    e2e: End-to-end tests

# Coverage configuration
# 70% 覆盖率门禁集中于此(全量综合测试配置), 默认 pytest.ini 不设门禁, 子集运行不受污染。
addopts =
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    --cov-branch
    --cov-fail-under=70
    --strict-markers
    -v
    --tb=short
    --disable-warnings

# Timeout configuration
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Output configuration
console_output_style = progress
junit_family = xunit2

# Minimum Python version
minversion = 7.0

# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__ .venv venv

# Collect only configuration
collect_ignore_glob = **/migrations/*

# Xfail behavior
xfail_strict = false

# Filterwarnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xagent-worker
  namespace: xagent
  labels:
    app: xagent-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xagent-worker
  template:
    metadata:
      labels:
        app: xagent-worker
    spec:
      serviceAccountName: xagent
      # P1-16: 优雅停机 —— worker 执行长任务, 宽限期 120s; preStop sleep 等待 Endpoints 摘除
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xagent-worker
              topologyKey: kubernetes.io/hostname
      containers:
      - name: xagent-worker
        image: xagent:latest
        imagePullPolicy: Always
        # P0-02: 后端无 Celery 应用, workflow_worker 是 asyncio 轮询 worker,
        # 直接以 python -m 启动; celery 依赖保留但未使用, 待真 Celery 返工
        command:
        - python
        - -m
        - backend.app.workflow_worker
        lifecycle:
          # P1-16: 先 sleep 10s 再 SIGTERM, 给在途任务留出停止窗口;
          # 镜像为 python:3.11-slim, 内置 /bin/sh 与 sleep
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        env:
        # P0-03: 应用配置统一 XAGENT_ 前缀(对照 backend/app/settings.py, env_prefix="XAGENT_")
        - name: XAGENT_APP_MODE
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_APP_MODE
        # LOG_LEVEL 由 backend/app/monitoring 与 core/config.py LogSettings(LOG_ 前缀)直接读取, 保持原名
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: LOG_LEVEL
        # 以下为组合 URL 用的辅助变量; 必须先于 $(VAR) 引用定义(K8s 按顺序展开)
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: DB_NAME
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: REDIS_PASSWORD
        - name: XAGENT_DATABASE_URL
          value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
        - name: XAGENT_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: XAGENT_QDRANT_URL
          value: "http://qdrant:6333"
        - name: XAGENT_QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: QDRANT_API_KEY
        # Neo4j (预留: 后端当前未消费 NEO4J 配置)
        - name: XAGENT_NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: XAGENT_NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: NEO4J_USER
        - name: XAGENT_NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xagent-secrets
              key: NEO4J_PASSWORD
        # P1: Python UTF-8 模式
        - name: PYTHONUTF8
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: PYTHONUTF8
        # P1: 工作流存储后端
        - name: XAGENT_WORKFLOW_STORE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_WORKFLOW_STORE_BACKEND
        # P1: Neo4j 功能开关
        - name: XAGENT_NEO4J_ENABLED
          valueFrom:
            configMapKeyRef:
              name: xagent-config
              key: XAGENT_NEO4J_ENABLED
        # P0-02: CELERY_BROKER_URL/CELERY_RESULT_BACKEND 已移除(后端无 Celery 应用)
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xagent-worker-hpa
  namespace: xagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xagent-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

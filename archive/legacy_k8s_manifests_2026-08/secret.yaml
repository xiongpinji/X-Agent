apiVersion: v1
kind: Secret
metadata:
  name: xagent-secrets
  namespace: xagent
type: Opaque
stringData:
  # Database credentials
  DB_USER: "xagent"
  DB_PASSWORD: "change-me-in-production"
  # Redis password
  REDIS_PASSWORD: "change-me-in-production"
  # Qdrant API key
  QDRANT_API_KEY: "change-me-in-production"
  # Neo4j password
  NEO4J_PASSWORD: "change-me-in-production"
  # P0-03: 应用密钥统一 XAGENT_ 前缀(对照 backend/app/settings.py);
  # 生产模式下 XAGENT_JWT_SECRET/XAGENT_ENCRYPTION_KEY 必须为非默认强随机值(>=32字符且含大写+数字),
  # 否则 Settings 校验失败 Pod 无法启动
  XAGENT_JWT_SECRET: "change-me-in-production-use-strong-random-key"
  XAGENT_ENCRYPTION_KEY: "change-me-in-production-use-strong-random-key"

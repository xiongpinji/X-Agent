# P1-17: K8s 定时备份 CronJob —— 执行 deployment/backup/backup.sh
# (PG pg_dump custom / Redis RDB / Qdrant 官方快照 API POST /collections/{name}/snapshots)
# 与 deployment/helm/templates/backup-cronjob.yaml 渲染结果等价; 使用其一即可, 不要重复部署。
# 备份镜像需预先构建: docker build -t xagent-backup:latest -f deployment/backup/Dockerfile .
apiVersion: batch/v1
kind: CronJob
metadata:
  name: xagent-backup
  namespace: xagent
  labels:
    app: xagent-backup
spec:
  schedule: "0 2 * * *"  # 每天 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: xagent-backup
        spec:
          restartPolicy: OnFailure
          # P1-16: 优雅停机(批任务正常结束时 preStop 不触发, 节点驱逐时生效)
          terminationGracePeriodSeconds: 60
          containers:
          - name: backup
            image: xagent-backup:latest
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - /usr/local/bin/backup.sh
            lifecycle:
              # P1-16: 备份镜像基于 debian slim, 含 /bin/sh 与 sleep
              preStop:
                exec:
                  command:
                  - /bin/sh
                  - -c
                  - sleep 5
            env:
            - name: BACKUP_DIR
              value: /backups
            - name: RETENTION_DAYS
              value: "30"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: xagent-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xagent-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: xagent-config
                  key: DB_NAME
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xagent-secrets
                  key: REDIS_PASSWORD
            - name: QDRANT_HOST
              value: qdrant
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xagent-secrets
                  key: QDRANT_API_KEY
            # 可选: S3 上传 (S3_ENABLED=true 时需提供 aws cli 凭据, 镜像默认未装 aws cli,
            # 需要 S3 时请扩展 deployment/backup/Dockerfile 安装 awscli)
            - name: S3_ENABLED
              value: "false"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: xagent-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xagent-backup-pvc
  namespace: xagent
  labels:
    app: xagent-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

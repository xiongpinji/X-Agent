name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy bandit[toml] pylint

    - name: Run ruff linter
      run: |
        ruff check backend/ tests/ --output-format=github
      continue-on-error: true

    - name: Run ruff formatter check
      run: |
        ruff format --check backend/ tests/
      continue-on-error: true

    - name: Run mypy type checker
      run: |
        mypy backend/ --ignore-missing-imports --no-strict-optional --junit-xml=mypy-report.xml
      continue-on-error: true

    - name: Run bandit security linter
      run: |
        bandit -r backend/ -c pyproject.toml -f json -o bandit-report.json
      continue-on-error: true

    - name: Run pylint
      run: |
        pylint backend/ --exit-zero --output-format=json > pylint-report.json || true
      continue-on-error: true

    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      with:
        name: quality-reports
        path: |
          mypy-report.xml
          bandit-report.json
          pylint-report.json
      if: always()

    - name: Comment PR with quality results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## Code Quality Report\n\n';

          try {
            const bandit = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            comment += `### Security Issues\n- High: ${bandit.metrics.high}\n- Medium: ${bandit.metrics.medium}\n- Low: ${bandit.metrics.low}\n\n`;
          } catch (e) {
            comment += '### Security Issues\nNo security issues found\n\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      continue-on-error: true

  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Run pre-commit hooks
      uses: pre-commit/action@v3
      continue-on-error: true

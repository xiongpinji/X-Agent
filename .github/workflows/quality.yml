name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy bandit[toml] pylint

    - name: Run ruff linter
      run: |
        ruff check \
          backend/app/api/workbench.py \
          backend/app/api/workbench_resources_bff.py \
          backend/app/api/workflows.py \
          scripts/commercial_delivery_closure_snapshot.py \
          tests/test_workbench_bff.py \
          tests/test_lite_mode.py \
          tests/test_security.py \
          tests/test_observability.py \
          tests/test_commercial_delivery_closure_snapshot.py \
          tests/test_commercial_pilot_final_gate.py \
          tests/test_commercial_pilot_delivery_manifest.py \
          tests/test_commercial_pilot_ops_status.py \
          --select E,F,W \
          --ignore E501 \
          --output-format=github
      continue-on-error: true

    - name: Run ruff formatter check
      run: |
        echo "Formatter check is covered by the dedicated pilot lint gate."
      continue-on-error: true

    - name: Run mypy type checker
      run: |
        mypy \
          backend/app/api/workbench.py \
          backend/app/api/workbench_resources_bff.py \
          backend/app/api/workflows.py \
          --ignore-missing-imports \
          --no-strict-optional \
          --junit-xml=mypy-report.xml
      continue-on-error: true

    - name: Run bandit security linter
      run: |
        bandit \
          backend/app/api/workbench.py \
          backend/app/api/workbench_resources_bff.py \
          backend/app/api/workflows.py \
          -c pyproject.toml \
          -f json \
          -o bandit-report.json
      continue-on-error: true

    - name: Run pylint
      run: |
        pylint \
          backend/app/api/workbench.py \
          backend/app/api/workbench_resources_bff.py \
          backend/app/api/workflows.py \
          --exit-zero \
          --output-format=json > pylint-report.json || true
      continue-on-error: true

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          mypy-report.xml
          bandit-report.json
          pylint-report.json
      if: always()

    - name: Record quality summary
      run: |
        echo "Quality reports are uploaded as artifacts for the scoped commercial pilot gate."
      continue-on-error: true

  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pre-commit
      run: python -m pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure
      continue-on-error: true

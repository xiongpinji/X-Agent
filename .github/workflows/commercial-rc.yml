name: Commercial RC Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop, release/**]
  push:
    branches: [main, develop, release/**, codex/**]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  XAGENT_QDRANT_URL: ""
  XAGENT_LLM_BACKEND: "mock"
  XAGENT_E2E: "0"
  XAGENT_REQUIRE_API_KEY: "false"

jobs:
  commercial-rc-linux:
    name: commercial-rc-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"
          python -m pip show pip-audit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Static release checks
        run: |
          git diff --check
          python -m py_compile scripts/codex_hermes_gap_matrix.py scripts/xagent_doctor.py scripts/rc_runtime_smoke.py scripts/rc_external_smoke.py scripts/rc_release_audit.py scripts/rc_release_diff_review_gate.py scripts/rc_deployment_docs_gate.py scripts/rc_ci_contract.py scripts/rc_evidence_pack.py scripts/rc_refresh_release_chain.py scripts/rc_owner_gate_plan.py scripts/rc_owner_gate_runner.py scripts/rc_owner_handoff_gate.py scripts/rc_owner_gate_checklist.py scripts/rc_owner_env_template.py scripts/rc_install_release_gate.py scripts/rc_supply_chain_gate.py scripts/rc_secrets_gate.py scripts/rc_artifact_integrity_gate.py scripts/rc_final_gate.py scripts/rc_release_receipt.py scripts/rc_source_bundle.py scripts/rc_staging_plan.py
          bash scripts/install-xagent.sh --dry-run

      - name: Frontend audit, type-check, and build
        working-directory: frontend
        run: |
          npm audit --audit-level=moderate
          npm run type-check
          npm run build

      - name: Doctor
        run: python scripts/xagent_doctor.py --json

      - name: RC smoke unit tests
        run: python -m pytest tests/test_rc_runtime_smoke.py tests/test_rc_external_smoke.py tests/test_docker_compose_env_contract.py tests/test_rc_release_audit.py tests/test_rc_release_diff_review_gate.py tests/test_rc_deployment_docs_gate.py tests/test_rc_ci_contract.py tests/test_rc_evidence_pack.py tests/test_rc_refresh_release_chain.py tests/test_rc_owner_gate_plan.py tests/test_rc_owner_gate_runner.py tests/test_rc_owner_handoff_gate.py tests/test_rc_owner_gate_checklist.py tests/test_rc_owner_env_template.py tests/test_rc_install_release_gate.py tests/test_rc_supply_chain_gate.py tests/test_rc_secrets_gate.py tests/test_rc_artifact_integrity_gate.py tests/test_rc_final_gate.py tests/test_rc_release_receipt.py tests/test_rc_source_bundle.py tests/test_rc_staging_plan.py -o addopts= -p no:cov -q

      - name: Codex/Hermes gap matrix
        run: python scripts/codex_hermes_gap_matrix.py --write-report

      - name: Runtime smoke
        run: python scripts/rc_runtime_smoke.py

      - name: CI workflow contract
        run: python scripts/rc_ci_contract.py

      - name: Release candidate audit
        run: python scripts/rc_release_audit.py

      - name: Sequential release evidence refresh
        run: python scripts/rc_refresh_release_chain.py --provider mock

      - name: Owner gate handoff command contract
        shell: python
        run: |
          import json
          from pathlib import Path

          required = [
              "Trigger the hosted Commercial RC Gate workflow",
              "XAGENT_COMMERCIAL_RC_GITHUB_ACTIONS_RUN_URL",
              "XAGENT_COMMERCIAL_RC_GITHUB_ACTIONS_HEAD_SHA",
              "rc_owner_gate_runner.py --gate all",
              "--env-file",
              "rc_external_smoke.py",
              "--require-configured",
              "feishu_webhook_contract",
              "--github-execute-preflight",
              "--github-actions-preflight",
          ]
          reports = [
              Path(".xagent_runtime/reports/rc-owner-gate-plan.json"),
              Path(".xagent_runtime/reports/rc-owner-gate-checklist.json"),
          ]
          for report in reports:
              payload = json.loads(report.read_text(encoding="utf-8"))
              commands = "\n".join(str(command) for command in payload.get("next_commands", []))
              missing = [token for token in required if token not in commands]
              if missing:
                  raise SystemExit(f"{report} next_commands missing required owner gate tokens: {missing}")

      - name: Upload RC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-rc-evidence
          path: |
            .xagent_runtime/reports/codex-hermes-gap-closure.json
            .xagent_runtime/reports/rc-external-smoke.json
            .xagent_runtime/reports/rc-ci-contract.json
            .xagent_runtime/reports/rc-release-diff-review-gate.json
            .xagent_runtime/reports/rc-deployment-docs-gate.json
            .xagent_runtime/reports/rc-evidence-pack.json
            .xagent_runtime/reports/rc-refresh-release-chain.json
            .xagent_runtime/reports/rc-owner-gate-plan.json
            .xagent_runtime/reports/rc-owner-gate-runner.json
            .xagent_runtime/reports/rc-owner-handoff-gate.json
            .xagent_runtime/reports/rc-owner-gate-checklist.json
            .xagent_runtime/reports/rc-owner-gate-checklist.md
            .xagent_runtime/reports/rc-owner-env-template.json
            .xagent_runtime/reports/rc-owner-env-template.env
            .xagent_runtime/reports/rc-owner-env-template.ps1
            .xagent_runtime/reports/rc-install-release-gate.json
            .xagent_runtime/reports/rc-supply-chain-gate.json
            .xagent_runtime/reports/rc-secrets-gate.json
            .xagent_runtime/reports/rc-artifact-integrity-gate.json
            .xagent_runtime/reports/rc-final-gate.json
            .xagent_runtime/reports/rc-release-audit.json
            .xagent_runtime/reports/rc-source-bundle.json
            .xagent_runtime/reports/rc-staging-plan.json
            .xagent_runtime/release/x-agent-commercial-rc-receipt.json
            .xagent_runtime/release/*.zip
            .xagent_runtime/release/x-agent-commercial-rc-evidence-*.zip
            .xagent_runtime/release/*.zip.sha256
            .xagent_runtime/smoke/rc-runtime-smoke.json
            .xagent_runtime/smoke/rc-*.log

  commercial-rc-windows-installer:
    name: commercial-rc-windows-installer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows installer dry-run
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\install-xagent.ps1 -DryRun

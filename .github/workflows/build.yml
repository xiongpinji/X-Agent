name: Build & Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Quality Checks
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,cli]"

    - name: Run code formatting check
      continue-on-error: true  # Advisory: formatting enforced via pre-commit locally
      run: |
        ruff format --check backend/ tests/ || true
        isort --check-only backend/ tests/ || true

    - name: Run linting
      run: |
        ruff check backend/ tests/ --select E9,F63,F7,F82 --output-format=github
        pylint backend/ --exit-zero || true

    - name: Run type checking
      continue-on-error: true  # Advisory: type checking is work in progress (3700+ errors)
      run: |
        mypy backend/ --ignore-missing-imports --no-strict-optional || true

    - name: Run unit tests
      run: |
        pytest tests/ -m "not e2e and not integration and not contracts" \
          -n auto \
          --cov=backend \
          --cov-report=xml \
          --cov-report=html \
          -v --tb=short --timeout=300

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: build-py311
        name: codecov-build
        fail_ci_if_error: false

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

    - name: Comment PR with build status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Build & Quality Checks Passed'
          });
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: build
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: x-agent-core:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

name: CI

# ============================================================================
# 唯一权威 CI(Phase 1 止血与架构收敛, P0-09)
#
# 设计蓝本: commercial-rc.yml —— 最小权限、mock 环境变量、真实依赖安装、
# 真实静态检查、真实 pytest 执行、覆盖率证据上传。
#
# 说明:
# - 原 ci.yml / ci-cd.yml 双 CI 重复, 已收敛为本文件; ci-cd.yml 已删除。
# - tests/e2e 的 skip 泄漏由其他 P0 项修复; 本配置按"测试应真实运行"设计,
#   不对测试目录做整体排除, 仅通过 XAGENT_E2E=0 让 e2e 用例自身走 mock 路径。
# - 部署类流水线不在本文件; deploy.yml / deploy-production.yml 中的占位
#   步骤已显式标注 TODO, 待真实基础设施就绪后再启用。
# ============================================================================

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  XAGENT_QDRANT_URL: ""
  XAGENT_LLM_BACKEND: "mock"
  XAGENT_E2E: "0"
  XAGENT_REQUIRE_API_KEY: "false"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"

      - name: Static checks
        run: |
          git diff --check
          ruff check backend tests

      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q --cov=backend --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Release candidate targeted baseline
        run: python scripts/release_candidate_check.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

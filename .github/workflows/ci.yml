name: CI

# ============================================================================
# 唯一权威 CI(Phase 1 止血与架构收敛, P0-09)
#
# 设计蓝本: commercial-rc.yml —— 最小权限、mock 环境变量、真实依赖安装、
# 真实静态检查、真实 pytest 执行、覆盖率证据上传。
#
# 说明:
# - 原 ci.yml / ci-cd.yml 双 CI 重复, 已收敛为本文件; ci-cd.yml 已删除。
# - tests/e2e 的 skip 泄漏由其他 P0 项修复; 本配置按"测试应真实运行"设计,
#   不对测试目录做整体排除, 仅通过 XAGENT_E2E=0 让 e2e 用例自身走 mock 路径。
# - 部署类流水线不在本文件; deploy.yml / deploy-production.yml 中的占位
#   步骤已显式标注 TODO, 待真实基础设施就绪后再启用。
# ============================================================================

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  XAGENT_QDRANT_URL: ""
  XAGENT_LLM_BACKEND: "mock"
  XAGENT_E2E: "0"
  XAGENT_REQUIRE_API_KEY: "false"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"

      # ruff 双层门禁(2026-07-19, Phase 1 第三波):
      # - 阻断层: E9/F63/F7/F82(语法错误/未定义名等真实错误)零容忍, 仅拦截新增;
      #   存量 20 个 F821/F822 列入豁免基线 .github/ruff-blocking-baseline.txt。
      #   TODO: 基线清零后移除 diff 豁免, 改为直接 ruff check --select E9,F63,F7,F82 backend tests
      - name: Static checks (blocking)
        run: |
          git diff --check
          ruff check --select E9,F63,F7,F82 backend tests --output-format=concise | grep -vE '^Found [0-9]+ errors?' > ruff-blocking.txt || true
          new_errors=$(grep -vxFf .github/ruff-blocking-baseline.txt ruff-blocking.txt || true)
          if [ -n "$new_errors" ]; then
            echo "::error::新增阻断级 lint 错误(不在豁免基线 .github/ruff-blocking-baseline.txt 内):"
            echo "$new_errors"
            exit 1
          fi
          echo "blocking layer OK: 无新增 E9/F63/F7/F82 错误(存量 20 个见豁免基线)"

      # 信息层: 全量 ruff 统计仅作观测, 存量 1 万+ lint 待分期清零, 见 commercial_audit
      - name: Static checks (informational)
        continue-on-error: true
        run: |
          ruff check backend tests --statistics || true

      # 覆盖率门禁(--cov-fail-under=70)暂不加入本步骤: 当前真实覆盖率仅约 19%, 硬门禁必失败;
      # 覆盖率门禁待 Phase 2 覆盖率提升后按 pytest_comprehensive.ini 收紧。
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q --cov=backend --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Release candidate targeted baseline
        run: python scripts/release_candidate_check.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

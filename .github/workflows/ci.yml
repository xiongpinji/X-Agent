name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  pilot-gate:
    name: Commercial Pilot Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused backend pilot tests
        run: |
          pytest tests/test_workbench_bff.py \
                 tests/test_lite_mode.py \
                 tests/test_security.py::test_workflow_run_ignores_client_tenant_id \
                 tests/test_observability.py \
            -q -o addopts=--no-cov --tb=short

      - name: Run frontend pilot gates
        working-directory: frontend
        run: |
          npm run type-check
          npm run build
          npm run report:panda:strict

      - name: Run commercial pilot gate contract tests
        run: |
          pytest tests/test_commercial_delivery_closure_snapshot.py \
                 tests/test_commercial_pilot_final_gate.py \
                 tests/test_commercial_pilot_delivery_manifest.py \
                 tests/test_commercial_pilot_ops_status.py \
            -q -o addopts=--no-cov --tb=short

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run focused pilot backend tests
        run: |
          pytest tests/test_workbench_bff.py \
                 tests/test_lite_mode.py \
                 tests/test_security.py::test_workflow_run_ignores_client_tenant_id \
                 tests/test_observability.py \
            -q -o addopts=--no-cov --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check \
            backend/app/api/skill_curator.py \
            backend/app/api/workbench.py \
            backend/app/api/workbench_resources_bff.py \
            backend/app/api/workflows.py \
            backend/app/core/database.py \
            backend/app/services/observability/langfuse_client.py \
            scripts/commercial_delivery_closure_snapshot.py \
            scripts/commercial_pilot_delivery_manifest.py \
            scripts/commercial_pilot_final_gate.py \
            scripts/commercial_pilot_ops_status.py \
            tests/test_lite_mode.py \
            tests/test_observability.py \
            tests/test_security.py \
            tests/test_workbench_bff.py \
            tests/test_commercial_delivery_closure_snapshot.py \
            tests/test_commercial_pilot_delivery_manifest.py \
            tests/test_commercial_pilot_final_gate.py \
            tests/test_commercial_pilot_ops_status.py \
            --select E,F,W \
            --ignore E501

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit legacy core audit
        run: |
          bandit -r backend/app/core/ -ll --skip B101

      - name: Run Python lockfile dependency audit
        run: pip-audit -r requirements-lock.txt --strict

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xagent:ci-${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm xagent:ci-${{ github.sha }} \
            python -c "from backend.app.settings import Settings; print('OK')"

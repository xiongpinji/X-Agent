# ============================================================================
# 唯一权威 CI (Phase 1 止血与架构收敛, P0-09)
#
# 设计蓝本: commercial-rc.yml —— 最小权限、mock 环境变量、真实依赖安装、
# 真实静态检查、真实 pytest 执行、覆盖率证据上传。
#
# 说明:
# - 原 ci.yml / ci-cd.yml 双 CI 重复, 已收敛为本文件; ci-cd.yml 已删除。
# - tests/e2e 的 skip 泄漏由其他 P0 项修复; 本配置按"测试应真实运行"设计,
#   不对测试目录做整体排除, 仅通过 XAGENT_E2E=0 让 e2e 用例自身走 mock 路径。
# - 部署类流水线不在本文件; deploy.yml / deploy-production.yml 中的占位
#   步骤已显式标注 TODO, 待真实基础设施就绪后再启用。
#
# 2026-07-24: 集成新测试与质量门禁:
#   - Ruff lint gate (blocking, F,E9)
#   - TypeScript check (blocking)
#   - Unit/Integration/E2E tests with proper flags
#   - Bandit security scan (non-blocking)
#   - Quality gate summary job
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  XAGENT_QDRANT_URL: ""
  XAGENT_LLM_BACKEND: "mock"
  XAGENT_E2E: "0"
  XAGENT_REQUIRE_API_KEY: "false"

jobs:
  # ─── Ruff Lint Gate (Blocking) ─────────────────────────────────────────────────
  ruff-lint:
    name: Ruff Lint (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # 阻断层: E9/F63/F7/F82 (语法错误/未定义名等真实错误) 零容忍, 仅拦截新增;
      # 存量 20 个 F821/F822 列入豁免基线 .github/ruff-blocking-baseline.txt。
      - name: Ruff check (blocking - new errors)
        run: |
          ruff check --select E9,F63,F7,F82 backend tests --output-format=concise | grep -vE '^Found [0-9]+ errors?' > ruff-blocking.txt || true
          new_errors=$(grep -vxFf .github/ruff-blocking-baseline.txt ruff-blocking.txt || true)
          if [ -n "$new_errors" ]; then
            echo "::error::新增阻断级 lint 错误(不在豁免基线 .github/ruff-blocking-baseline.txt 内):"
            echo "$new_errors"
            exit 1
          fi
          echo "blocking layer OK: 无新增 E9/F63/F7/F82 错误(存量见豁免基线)"

      # F,E9 阻断检查 (新增要求)
      - name: Ruff check (F,E9 blocking)
        run: ruff check backend/ --select F,E9

      # 信息层: 全量 ruff 统计仅作观测
      - name: Ruff check (informational)
        continue-on-error: true
        run: ruff check backend tests --statistics || true

  # ─── TypeScript Check (Blocking) ───────────────────────────────────────────────
  typescript-check:
    name: TypeScript Check (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ─── Backend Unit Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [ruff-lint]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XAGENT_APP_MODE: development
      XAGENT_DATABASE_URL: postgresql+asyncpg://xagent:xagent@localhost:5432/xagent_test
      XAGENT_REDIS_URL: redis://localhost:6379/0
      XAGENT_MEMORY_BACKEND: postgres
      XAGENT_ADMIN_STORE_BACKEND: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"

      - name: Run unit tests (tests/unit/)
        run: |
          python -m pytest tests/unit/ --no-cov -q --tb=short --timeout=120

      - name: Run integration tests (tests/integration/)
        run: |
          python -m pytest tests/integration/ --no-cov -q --tb=short --timeout=120

      - name: Run e2e tests (tests/e2e/)
        run: |
          python -m pytest tests/e2e/ --no-cov -q --tb=short --timeout=120

      - name: Run full test suite with coverage
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=backend --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Release candidate targeted baseline
        run: python scripts/release_candidate_check.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  # ─── Security Scan (Non-blocking) ─────────────────────────────────────────────
  security-scan:
    name: Security Scan (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Bandit security scan
        run: bandit -r backend/app/ -ll --skip B101 || true

  # ─── Frontend Build ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [typescript-check]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ─── Docker Build ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xagent:ci .

      - name: Verify image
        run: docker run --rm xagent:ci python -c "from backend.app.main import app; print(f'Routes: {len(app.routes)}')"

  # ─── Quality Gate Summary ──────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [ruff-lint, typescript-check, backend-test, security-scan, frontend-build, docker-build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Quality gate report
        run: |
          echo "## Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff Lint (F,E9) | ${{ needs.ruff-lint.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Check | ${{ needs.typescript-check.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ PASS (non-blocking)' || '⚠️ WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Fail if blocking checks failed
        run: |
          FAILED=0
          if [ "${{ needs.ruff-lint.result }}" != "success" ]; then
            echo "::error::Ruff lint gate FAILED"
            FAILED=1
          fi
          if [ "${{ needs.typescript-check.result }}" != "success" ]; then
            echo "::error::TypeScript check FAILED"
            FAILED=1
          fi
          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "::error::Backend tests FAILED"
            FAILED=1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Frontend build FAILED"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Quality gate FAILED — one or more blocking checks did not pass."
            exit 1
          fi
          echo "✅ All blocking quality gates passed."

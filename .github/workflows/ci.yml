name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run new module tests
        run: |
          pytest tests/test_rbac.py \
                 tests/test_web_search.py \
                 tests/test_skills_framework.py \
                 tests/test_lightweight_sandbox.py \
                 tests/test_rate_limiter_redis.py \
            -v -o addopts="" -p no:cov --tb=short

      - name: Run core tests
        continue-on-error: true
        run: |
          pytest tests/ \
            -x -q \
            --timeout=120 \
            -o addopts="" \
            -p no:cov \
            -p no:xdist \
            --ignore=tests/e2e \
            --ignore=tests/performance \
            -k "not playwright"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check backend/ cli/ sdk/ \
            --select E,F,W \
            --ignore E501

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit
        run: |
          bandit -r backend/app/core/ -ll --skip B101

      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit --strict --ignore-vuln GHSA-xxxx

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xagent:ci-${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm xagent:ci-${{ github.sha }} \
            python -c "from backend.app.settings import Settings; print('OK')"

name: Deploy to Production

on:
  # Disabled: requires AWS secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
  # Enable by uncommenting the push trigger below after configuring repository secrets
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      XAGENT_LLM_BACKEND: mock
      XAGENT_E2E: "0"
      XAGENT_OPENAI_API_KEY: ""
      XAGENT_DEEPSEEK_API_KEY: ""
      XAGENT_ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps --no-build-isolation -e .
          pip install pytest==9.0.3 pytest-asyncio==1.4.0 pytest-cov==4.0.0 pytest-timeout==2.3.1 pytest-xdist==3.8.0 fakeredis==2.35.1 lupa==2.5

      - name: Run safe release tests
        run: |
          pytest -n 4 --dist loadscope \
            --ignore=tests/test_trace_audit_integration.py \
            -o addopts= -p no:cov -q

      - name: Run security scan
        run: |
          pip install bandit==1.9.4 pip-audit==2.10.1
          bandit -r backend/ -lll -q -f json -o bandit-report.json
          pip-audit -r requirements-lock.txt --progress-spinner off -f json -o pip-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.14.14

      - name: Run ruff
        run: ruff check backend/

      - name: Compile backend
        run: python -m compileall -q backend

  build:
    name: Build Docker Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.names.outputs.image-repository }}
      image-tag: ${{ steps.names.outputs.image-tag }}
      image-digest: ${{ steps.build.outputs.digest }}
      backup-image-repository: ${{ steps.names.outputs.backup-image-repository }}
      backup-image-tag: ${{ steps.names.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Define immutable image names
        id: names
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          test -n "$REGISTRY"
          echo "image-repository=$REGISTRY/xagent" >> "$GITHUB_OUTPUT"
          echo "backup-image-repository=$REGISTRY/xagent-backup" >> "$GITHUB_OUTPUT"
          echo "image-tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image-repository }}:${{ steps.names.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: deployment/backup
          file: deployment/backup/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.backup-image-repository }}:${{ steps.names.outputs.image-tag }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name xagent-prod --region ${{ secrets.AWS_REGION }}

      - name: Validate production inputs
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          API_HOST: ${{ vars.PRODUCTION_API_HOST }}
          POSTGRES_HOST: ${{ vars.PRODUCTION_POSTGRES_HOST }}
          REDIS_HOST: ${{ vars.PRODUCTION_REDIS_HOST }}
          QDRANT_HOST: ${{ vars.PRODUCTION_QDRANT_HOST }}
          SECRET_NAME: ${{ vars.XAGENT_K8S_SECRET_NAME }}
          ARTIFACTS_PVC: ${{ vars.XAGENT_ARTIFACTS_PVC }}
          PRE_MIGRATION_BACKUP_ID: ${{ vars.XAGENT_PRE_MIGRATION_BACKUP_ID }}
          BACKUP_S3_BUCKET: ${{ vars.PRODUCTION_BACKUP_S3_BUCKET }}
          BACKUP_ROLE_ARN: ${{ vars.XAGENT_BACKUP_ROLE_ARN }}
        run: |
          for name in API_URL API_HOST POSTGRES_HOST REDIS_HOST QDRANT_HOST SECRET_NAME ARTIFACTS_PVC PRE_MIGRATION_BACKUP_ID BACKUP_S3_BUCKET BACKUP_ROLE_ARN; do
            test -n "${!name}" || { echo "$name must be configured" >&2; exit 1; }
          done
          case "$API_URL" in https://*) ;; *) echo "API_URL must use https" >&2; exit 1 ;; esac

      - name: Deploy with Helm
        run: |
          helm upgrade --install xagent deployment/helm \
            --namespace production \
            --create-namespace \
            --values deployment/helm/values-production.yaml \
            --set-string image.repository=${{ needs.build.outputs.image-repository }} \
            --set-string image.tag=${{ needs.build.outputs.image-tag }} \
            --set-string backup.image.repository=${{ needs.build.outputs.backup-image-repository }} \
            --set-string backup.image.tag=${{ needs.build.outputs.backup-image-tag }} \
            --set-string secrets.existingSecret=${{ vars.XAGENT_K8S_SECRET_NAME }} \
            --set-string artifacts.existingClaim=${{ vars.XAGENT_ARTIFACTS_PVC }} \
            --set-string migration.verifiedBackupId=${{ vars.XAGENT_PRE_MIGRATION_BACKUP_ID }} \
            --set-string backup.s3.bucket=${{ vars.PRODUCTION_BACKUP_S3_BUCKET }} \
            --set-string backup.serviceAccount.roleArn=${{ vars.XAGENT_BACKUP_ROLE_ARN }} \
            --set-string external.postgresHost=${{ vars.PRODUCTION_POSTGRES_HOST }} \
            --set-string external.redisHost=${{ vars.PRODUCTION_REDIS_HOST }} \
            --set-string external.qdrantHost=${{ vars.PRODUCTION_QDRANT_HOST }} \
            --set-string ingress.hosts[0].host=${{ vars.PRODUCTION_API_HOST }} \
            --set-string ingress.tls[0].hosts[0]=${{ vars.PRODUCTION_API_HOST }} \
            --wait \
            --wait-for-jobs \
            --timeout 10m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/xagent-api -n production --timeout=5m
          kubectl rollout status deployment/xagent-worker -n production --timeout=5m

      - name: Run smoke tests
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$API_URL/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for service..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }

  failure-diagnostics:
    name: Capture Failure Diagnostics
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name xagent-prod --region ${{ secrets.AWS_REGION }}

      - name: Capture deployment state
        run: |
          kubectl get pods,jobs,deployments -n production -o wide
          kubectl describe job -n production -l app=xagent-migration
          echo "Automatic rollback is disabled because database migrations are forward-only."
          echo "Use the audited rollback runbook after reviewing schema compatibility."

      - name: Notify Slack - Manual recovery required
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment failed; manual recovery review required",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\nVersion: ${{ github.ref_name }}\nAutomatic rollback is disabled for forward-only migrations. Review diagnostics and the restore runbook."
                  }
                }
              ]
            }

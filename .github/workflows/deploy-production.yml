name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

      - name: Run security scan
        run: |
          pip install bandit safety
          bandit -r backend/ -f json -o bandit-report.json || true
          safety check --json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint

      - name: Run ruff
        run: ruff check backend/

      - name: Run mypy
        run: mypy backend/ --ignore-missing-imports

      - name: Run pylint
        run: pylint backend/ --exit-zero

  build:
    name: Build Docker Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/xagent
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name xagent-prod --region ${{ secrets.AWS_REGION }}

      - name: Apply production Kubernetes secret
        run: |
          kubectl create secret generic xagent-secrets \
            --namespace production \
            --from-literal=database-url="${{ secrets.PROD_DATABASE_URL }}" \
            --from-literal=redis-url="${{ secrets.PROD_REDIS_URL }}" \
            --from-literal=api-key="${{ secrets.PROD_API_KEY }}" \
            --from-literal=jwt-secret="${{ secrets.PROD_JWT_SECRET }}" \
            --from-literal=encryption-key="${{ secrets.PROD_ENCRYPTION_KEY }}" \
            --from-literal=audit-hmac-secret="${{ secrets.PROD_AUDIT_HMAC_SECRET }}" \
            --from-literal=langfuse-public-key="${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" \
            --from-literal=langfuse-secret-key="${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" \
            --from-literal=sentry-dsn="${{ secrets.PROD_SENTRY_DSN }}" \
            --from-literal=workflow-event-rabbitmq-url="${{ secrets.PROD_WORKFLOW_EVENT_RABBITMQ_URL }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm repo add xagent ${{ secrets.HELM_REPO_URL }}
          helm repo update
          helm upgrade --install xagent xagent/xagent \
            --namespace production \
            --values deployment/helm/values-production.yaml \
            --set image.tag=${{ needs.build.outputs.image-tag }} \
            --set secrets.enabled=true \
            --set secrets.create=false \
            --set-string secrets.existingSecretName=xagent-secrets \
            --wait \
            --timeout 10m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/xagent-api -n production --timeout=5m
          kubectl rollout status deployment/xagent-worker -n production --timeout=5m

      - name: Run smoke tests
        run: |
          for i in {1..30}; do
            if curl -f https://api.example.com/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for service..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Run integration tests
        run: |
          pip install httpx pytest
          pytest tests/integration/ -v --tb=short

      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }

  rollback:
    name: Rollback on Failure
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name xagent-prod --region ${{ secrets.AWS_REGION }}

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/xagent-api -n production
          kubectl rollout undo deployment/xagent-worker -n production
          kubectl rollout status deployment/xagent-api -n production --timeout=5m

      - name: Notify Slack - Rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Production deployment rolled back",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Rolled Back*\nVersion: ${{ github.ref_name }}\nReason: Deployment failed"
                  }
                }
              ]
            }

name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-09-05 门禁转 blocking（此前 continue-on-error 导致失败不挡合并，
    # 21 个测试失败积累数周的根因）。纯计时/压测已挂 performance 标记，
    # 在此排除、由 advisory 的 performance-tests job 单独跑。
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,cli]"

    - name: Install Playwright browsers
      # browser 测试需要真实 chromium（此前被 continue-on-error 掩盖的缺失）
      run: python -m playwright install chromium --with-deps

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test
        REDIS_URL: redis://localhost:6379
        QDRANT_URL: http://localhost:6333

        # 单测密闭性：不启动调度常驻循环（生产由 startup 默认开启）
        XAGENT_SCHEDULER_ENABLED: "false"
      run: |
        pytest tests/ -m "not e2e and not performance" -n auto -v --tb=short --timeout=300

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests-py${{ matrix.python-version }}
        name: codecov-py${{ matrix.python-version }}
        fail_ci_if_error: false

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-results.xml

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,cli]"

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test
        REDIS_URL: redis://localhost:6379
        QDRANT_URL: http://localhost:6333

        XAGENT_SCHEDULER_ENABLED: "false"
      # 2026-09-06：integration 标记当前 0 用例（-m "integration" 空收集退出码 5，
      # 此前被 continue-on-error 掩盖）；真实集成测试在 tests/integration/ 目录
      run: |
        pytest tests/integration/ -v --tb=short

  contract-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,cli]"

    - name: Run contract tests
      env:
        DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test
        REDIS_URL: redis://localhost:6379
        QDRANT_URL: http://localhost:6333

        # 契约测试密闭性：不启动调度常驻循环（与 unit job 惯例一致）
        XAGENT_SCHEDULER_ENABLED: "false"
      run: |
        pytest tests/ -m "contracts" -v --tb=short

  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,cli]"
        pip install locust

    - name: Run performance tests
      env:
        DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test
        REDIS_URL: redis://localhost:6379
        QDRANT_URL: http://localhost:6333

        # 共享 runner 负载抖动：阈值统一放宽 2 倍（计时类测试的既定逃生口）
        XAGENT_PERF_THRESHOLD_MULTIPLIER: "2.0"
      # Advisory by design：计时/压测阈值天然受同机负载影响，不挡合并。
      # 2026-09-05 起该 job 通过 performance 标记收集正确的测试集合。
      run: |
        pytest tests/ -m "performance" -v --tb=short || true

    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results/

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, contract-tests]
    if: always()

    steps:
    - name: Download all test artifacts
      uses: actions/download-artifact@v4

    - name: Generate test summary
      run: |
        echo "## Test Summary" > test-summary.md
        echo "" >> test-summary.md
        echo "### Test Results" >> test-summary.md
        echo "- Unit Tests: $([ -d test-results-py3.11 ] && echo '✓' || echo '✗')" >> test-summary.md
        echo "- Integration Tests: ✓" >> test-summary.md
        echo "- Contract Tests: ✓" >> test-summary.md
        cat test-summary.md

    - name: Upload test summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test-summary.md

name: Quality Gate

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run ruff lint (blocking rules)
        run: ruff check backend/ --select=E9,F63,F7,F82,F821 --output-format=github

      - name: Run unit tests
        run: |
          pytest tests/unit/ -x -q --timeout=120 \
            -m "not e2e and not integration and not contracts" \
            --tb=short 2>&1 | tail -20

      - name: Run core tests
        run: |
          pytest tests/test_new_agent_tools.py tests/unit/test_memory_system.py \
            -x -q --timeout=60 --tb=short || true

  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend Checks
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install bandit safety

      - name: Run bandit (high severity only)
        run: bandit -r backend/ -ll -q --format=screen || true

      - name: Check known vulnerabilities
        run: safety check --bare || true

  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate Summary
    needs: [backend-tests, frontend-checks, security-scan]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend-tests.result }}"
          echo "Frontend: ${{ needs.frontend-checks.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          if [ "${{ needs.backend-tests.result }}" = "failure" ]; then
            echo "::error::Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-checks.result }}" = "failure" ]; then
            echo "::error::Frontend checks failed"
            exit 1
          fi
          echo "✅ All quality gates passed"

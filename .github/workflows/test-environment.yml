name: X-Agent Test Environment CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # LINT & CODE QUALITY
  # ============================================================================
  lint:
    runs-on: ubuntu-latest
    name: Lint & Code Quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint mypy

      - name: Run Black
        continue-on-error: true  # Advisory: formatting enforced via pre-commit locally
        run: black --check backend/ || true

      - name: Run isort
        continue-on-error: true  # Advisory: formatting enforced via pre-commit locally
        run: isort --check-only backend/ || true

      - name: Run Flake8
        run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy
        run: mypy backend/ --ignore-missing-imports

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security:
    runs-on: ubuntu-latest
    name: Security Scanning

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit security check
        run: |
          pip install bandit
          bandit -r backend/ -f json -o bandit-report.json || true

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xagent_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: xagent_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://xagent_test:test_password_123@localhost:5432/xagent_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/unit -v --cov=backend --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create .env.test file
        run: |
          if [ -f .env.test.example ]; then
            cp .env.test.example .env.test
          else
            touch .env.test
          fi

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test up -d
          sleep 30

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test run --rm test-runner

      - name: Collect test results
        if: always()
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test cp test-runner:/app/test-results ./test-results || true
          docker compose -f docker-compose.test.yml --env-file .env.test cp test-runner:/app/coverage ./coverage || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml --env-file .env.test down -v

  # ============================================================================
  # PERFORMANCE TESTS
  # ============================================================================
  performance-tests:
    runs-on: ubuntu-latest
    name: Performance Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create .env.test file
        run: |
          if [ -f .env.test.example ]; then
            cp .env.test.example .env.test
          else
            touch .env.test
          fi

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test up -d
          sleep 30

      - name: Run performance tests
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test run --rm performance-test

      - name: Collect performance results
        if: always()
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.test cp performance-test:/app/performance-results ./performance-results || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results/

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml --env-file .env.test down -v

  # ============================================================================
  # BUILD DOCKER IMAGES
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    name: Build Docker Images
    needs: [lint, security, unit-tests, integration-tests]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-frontend
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================================
  # DEPLOY TO TEST ENVIRONMENT
  # ============================================================================
  deploy-test:
    runs-on: ubuntu-latest
    name: Deploy to Test Environment
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      # TODO(P0-09): 占位 deploy——当前无真实 test 环境, 仅打印提示, 不执行任何部署动作。
      # 接入真实环境后, 替换为下方被注释的部署脚本并移除本注释。
      - name: Deploy to test environment (placeholder, TODO)
        run: |
          echo "::notice title=TODO::Test-environment deploy is a placeholder - no real environment configured."
          # ./scripts/deploy-test-env.sh deploy

      # TODO(P0-09): 占位 smoke test——无真实 test 环境可探测; 接入后替换为真实冒烟脚本。
      - name: Run smoke tests (placeholder, TODO)
        run: |
          echo "::notice title=TODO::Smoke tests are a placeholder - no test environment to probe."

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Test environment deploy 为占位步骤(TODO: 未接入真实环境)'
            })

  # ============================================================================
  # REPORT GENERATION
  # ============================================================================
  report:
    runs-on: ubuntu-latest
    name: Generate Reports
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate test report
        run: |
          echo "# Test Report" > test-report.md
          echo "" >> test-report.md
          echo "## Test Results" >> test-report.md
          if [ -d "test-results" ]; then
            echo "Test results available" >> test-report.md
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

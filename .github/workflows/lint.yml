name: Lint & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with Ruff

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run ruff check
      run: |
        ruff check \
          backend/app/api/skill_curator.py \
          backend/app/api/workbench.py \
          backend/app/api/workbench_resources_bff.py \
          backend/app/api/workflows.py \
          backend/app/core/database.py \
          backend/app/services/observability/langfuse_client.py \
          scripts/commercial_delivery_closure_snapshot.py \
          scripts/commercial_pilot_delivery_manifest.py \
          scripts/commercial_pilot_final_gate.py \
          scripts/commercial_pilot_ops_status.py \
          tests/test_lite_mode.py \
          tests/test_observability.py \
          tests/test_security.py \
          tests/test_workbench_bff.py \
          tests/test_commercial_delivery_closure_snapshot.py \
          tests/test_commercial_pilot_delivery_manifest.py \
          tests/test_commercial_pilot_final_gate.py \
          tests/test_commercial_pilot_ops_status.py \
          --select E,F,W \
          --ignore E501 \
          --output-format=github

    - name: Run ruff format check
      continue-on-error: true
      run: |
        ruff format --check backend/ tests/

  type-check:
    runs-on: ubuntu-latest
    name: Type Check with Mypy

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-redis types-requests

    - name: Run mypy
      run: |
        mypy backend/ --ignore-missing-imports --no-strict-optional --junit-xml=mypy-report.xml
      continue-on-error: true

    - name: Upload mypy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mypy-report
        path: mypy-report.xml

  complexity:
    runs-on: ubuntu-latest
    name: Complexity Check

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install radon
      run: |
        python -m pip install --upgrade pip
        pip install radon

    - name: Check cyclomatic complexity
      run: |
        radon cc backend/ -a -nb --total-average > complexity-report.txt || true

    - name: Check maintainability index
      run: |
        radon mi backend/ -nb >> complexity-report.txt || true

    - name: Upload complexity report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: complexity-report
        path: complexity-report.txt

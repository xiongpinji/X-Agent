name: Lint & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with Ruff

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    # 阻断层: E9/F63/F7/F82 真实错误直接拦截 (baseline 已清零)
    - name: Run ruff check (blocking)
      run: |
        ruff check --select E9,F63,F7,F82 backend/ tests/ --output-format=concise

    # 信息层: 全量 ruff 统计仅作观测, 存量 1 万+ lint 待分期清零, 见 commercial_audit
    - name: Run ruff check (informational)
      continue-on-error: true
      run: |
        ruff check backend/ tests/ --output-format=github --statistics || true

    # 信息层: 存量 768 个文件待 format, 分期清零前不阻断, 见 commercial_audit
    - name: Run ruff format check
      continue-on-error: true
      run: |
        ruff format --check backend/ tests/ || true

  type-check:
    runs-on: ubuntu-latest
    name: Type Check with Mypy

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-redis types-requests

    - name: Run mypy
      run: |
        mypy backend/ --ignore-missing-imports --no-strict-optional --junit-xml=mypy-report.xml
      continue-on-error: true

    - name: Upload mypy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mypy-report
        path: mypy-report.xml

  complexity:
    runs-on: ubuntu-latest
    name: Complexity Check

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install radon
      run: |
        python -m pip install --upgrade pip
        pip install radon

    - name: Check cyclomatic complexity
      run: |
        radon cc backend/ -a -nb --total-average > complexity-report.txt || true

    - name: Check maintainability index
      run: |
        radon mi backend/ -nb >> complexity-report.txt || true

    - name: Upload complexity report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: complexity-report
        path: complexity-report.txt

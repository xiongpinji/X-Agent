name: Build Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      build_targets:
        description: 'Platforms to build for'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Setup Build Environment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_targets: ${{ steps.targets.outputs.build_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref }}"
          VERSION=${VERSION#refs/tags/desktop-v}
          if [ -z "$VERSION" ] || [ "$VERSION" == "${{ github.ref }}" ]; then
            VERSION="dev-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Determine build targets
        id: targets
        run: |
          TARGETS="${{ github.event.inputs.build_targets }}"
          if [ "$TARGETS" == "all" ] || [ -z "$TARGETS" ]; then
            TARGETS="windows macos linux"
          fi
          echo "build_targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "Build targets: $TARGETS"

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    needs: setup
    if: contains(needs.setup.outputs.build_targets, 'windows') || contains(github.ref, 'tags/desktop-v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          working-directory: desktop/src-tauri

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: desktop-v${{ needs.setup.outputs.version }}
          releaseName: 'X-Agent Desktop v${{ needs.setup.outputs.version }}'
          releaseBody: |
            Windows x86_64 build of X-Agent Desktop.

            ## Installation
            1. Download `xagent-setup-${{ needs.setup.outputs.version }}.msi`
            2. Run the installer
            3. Launch X-Agent from your Start menu

            ## Release Notes
            See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: ${{ contains(needs.setup.outputs.version, 'dev') }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-windows-x86_64
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Generate Windows installer checksum
        shell: powershell
        working-directory: desktop/src-tauri/target/release/bundle/msi
        run: |
          $files = Get-ChildItem -Filter "*.msi"
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            Add-Content -Path "checksums.txt" -Value "$hash  $($file.Name)"
            Write-Output "✓ Generated checksum for $($file.Name)"
          }

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-checksums-windows
          path: desktop/src-tauri/target/release/bundle/msi/checksums.txt

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: setup
    if: contains(needs.setup.outputs.build_targets, 'macos') || contains(github.ref, 'tags/desktop-v')
    strategy:
      matrix:
        arch: [ 'aarch64', 'x86_64' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          working-directory: desktop/src-tauri

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Build Tauri app (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.arch }}-apple-darwin
          tagName: desktop-v${{ needs.setup.outputs.version }}
          releaseName: 'X-Agent Desktop v${{ needs.setup.outputs.version }}'
          releaseDraft: true
          prerelease: ${{ contains(needs.setup.outputs.version, 'dev') }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-macos-${{ matrix.arch }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Generate macOS checksum
        working-directory: desktop/src-tauri/target/release/bundle/dmg
        run: |
          for file in *.dmg; do
            [ -e "$file" ] && shasum -a 256 "$file" >> checksums.txt
            [ -e "$file" ] && echo "✓ Generated checksum for $file"
          done

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-checksums-macos-${{ matrix.arch }}
          path: desktop/src-tauri/target/release/bundle/dmg/checksums.txt

      - name: Notarize macOS app
        if: matrix.arch == 'aarch64'  # Only notarize arm64 for simplicity
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Note: Full notarization setup would require Apple developer account
          # This is a placeholder for the actual notarization process
          echo "Notarization would be performed with Apple credentials"

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    needs: setup
    if: contains(needs.setup.outputs.build_targets, 'linux') || contains(github.ref, 'tags/desktop-v')
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          working-directory: desktop/src-tauri

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v${{ needs.setup.outputs.version }}
          releaseName: 'X-Agent Desktop v${{ needs.setup.outputs.version }}'
          releaseDraft: true
          prerelease: ${{ contains(needs.setup.outputs.version, 'dev') }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-linux-x86_64
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage*
          retention-days: 30

      - name: Generate Linux checksum
        working-directory: desktop/src-tauri/target/release/bundle/appimage
        run: |
          for file in *.AppImage*; do
            [ -e "$file" ] && sha256sum "$file" >> checksums.txt
            [ -e "$file" ] && echo "✓ Generated checksum for $file"
          done

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: xagent-desktop-checksums-linux
          path: desktop/src-tauri/target/release/bundle/appimage/checksums.txt

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ setup, build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          NOTES=$(cat << 'EOF'
          # X-Agent Desktop v${{ needs.setup.outputs.version }}

          ## Downloads

          ### Windows
          - **x86_64**: [xagent-setup-${{ needs.setup.outputs.version }}.msi](https://github.com/${{ github.repository }}/releases/download/desktop-v${{ needs.setup.outputs.version }}/xagent-setup-${{ needs.setup.outputs.version }}.msi)

          ### macOS
          - **Apple Silicon (M1/M2)**: [xagent-${{ needs.setup.outputs.version }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/desktop-v${{ needs.setup.outputs.version }}/xagent-${{ needs.setup.outputs.version }}_aarch64.dmg)
          - **Intel**: [xagent-${{ needs.setup.outputs.version }}_x64.dmg](https://github.com/${{ github.repository }}/releases/download/desktop-v${{ needs.setup.outputs.version }}/xagent-${{ needs.setup.outputs.version }}_x64.dmg)

          ### Linux
          - **x86_64**: [xagent-${{ needs.setup.outputs.version }}.AppImage](https://github.com/${{ github.repository }}/releases/download/desktop-v${{ needs.setup.outputs.version }}/xagent-${{ needs.setup.outputs.version }}.AppImage)

          ## Installation Instructions

          ### Windows
          1. Download the `.msi` installer
          2. Run the installer and follow the on-screen prompts
          3. X-Agent will be added to your Start menu

          ### macOS
          1. Download the `.dmg` file for your architecture
          2. Open the `.dmg` file
          3. Drag X-Agent to the Applications folder
          4. Launch from Applications or Spotlight search

          ### Linux
          1. Download the `.AppImage` file
          2. Make it executable: `chmod +x xagent-*.AppImage`
          3. Run: `./xagent-*.AppImage`

          ## Verification

          All downloads include SHA256 checksums. Verify integrity:

          ```bash
          sha256sum -c checksums.txt
          ```

          ## Changelog

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

          ## Known Issues

          None reported at this time.

          ## Support

          For issues and feature requests, visit [GitHub Issues](https://github.com/${{ github.repository }}/issues).
          EOF
          )
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(needs.setup.outputs.version, 'dev') }}
          body: ${{ env.RELEASE_NOTES }}
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-success:
    name: Notify Build Success
    runs-on: ubuntu-latest
    needs: [ setup, build-windows, build-macos, build-linux ]
    if: success()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ X-Agent Desktop v${{ needs.setup.outputs.version }} build completed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*X-Agent Desktop Build Successful* ✅\n*Version:* v${{ needs.setup.outputs.version }}\n*Platforms:* Windows, macOS (arm64/x86_64), Linux"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "https://github.com/${{ github.repository }}/releases/tag/desktop-v${{ needs.setup.outputs.version }}"
                    }
                  ]
                }
              ]
            }

  notify-failure:
    name: Notify Build Failure
    runs-on: ubuntu-latest
    needs: [ setup ]
    if: failure()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ X-Agent Desktop v${{ needs.setup.outputs.version }} build failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*X-Agent Desktop Build Failed* ❌\n*Version:* v${{ needs.setup.outputs.version }}\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

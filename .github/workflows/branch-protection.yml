name: Branch Protection Rules

on:
  workflow_dispatch:

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Configure branch protection for main
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          try {
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: [
                  // ci.yml 为 Phase 1 收敛后的唯一权威 CI(P0-09), 其 check 名 'ci' 必须纳入必需检查
                  'ci',
                  'unit-tests (3.11)',
                  'unit-tests (3.12)',
                  'integration-tests',
                  'contract-tests',
                  'Lint with Ruff',
                  'Type Check with Mypy',
                  'Bandit Security Scan',
                  'Dependency Vulnerability Scan'
                ]
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_approving_review_count: 2
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              required_linear_history: true,
              require_conversation_resolution: true
            });
            console.log('✓ Branch protection configured for main');
          } catch (error) {
            console.log('Branch protection configuration:', error.message);
          }

    - name: Configure branch protection for develop
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          try {
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'develop',
              required_status_checks: {
                strict: true,
                contexts: [
                  // ci.yml 为 Phase 1 收敛后的唯一权威 CI(P0-09), 其 check 名 'ci' 必须纳入必需检查
                  'ci',
                  'unit-tests (3.11)',
                  'unit-tests (3.12)',
                  'integration-tests',
                  'Lint with Ruff',
                  'Type Check with Mypy',
                  'Bandit Security Scan'
                ]
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                required_approving_review_count: 1
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              required_linear_history: false,
              require_conversation_resolution: true
            });
            console.log('✓ Branch protection configured for develop');
          } catch (error) {
            console.log('Branch protection configuration:', error.message);
          }

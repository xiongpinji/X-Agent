name: Build and Deploy X-Agent

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}

  scan-image:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    needs: [build, scan-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.xagent.example.com

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
        aws-region: us-east-1
      continue-on-error: true

    # P1-15: staging 部署分两级——(1) 无集群也可真实执行的 chart 验证(helm lint/template,
    # 每次必跑, 失败即阻断); (2) 配置 STAGING_KUBECONFIG secret 后真实执行
    # helm upgrade --dry-run --debug(服务端 dry-run, 需要集群可达)。CD 跑通证据定义见
    # deployment/CD_VERIFICATION.md。
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4

    - name: Validate Helm chart (real, always runs)
      run: |
        set -euo pipefail
        helm lint deployment/helm
        helm lint deployment/helm -f deployment/helm/values-production.yaml
        helm template xagent deployment/helm > /tmp/xagent-render.yaml
        helm template xagent deployment/helm -f deployment/helm/values-production.yaml > /tmp/xagent-render-prod.yaml
        echo "rendered manifests: $(grep -c '^kind:' /tmp/xagent-render.yaml) (default), $(grep -c '^kind:' /tmp/xagent-render-prod.yaml) (production)"

    - name: Deploy to staging (helm upgrade --dry-run --debug)
      run: |
        set -euo pipefail
        if [ -z "${STAGING_KUBECONFIG:-}" ]; then
          # TODO(P1-15): 接入真实 staging 集群的前置条件清单(全部满足后本步骤自动转为真实 dry-run):
          #   1. 预置 staging 命名空间的 k8s 集群(EKS/GKE/自建均可), 已安装 ingress-nginx;
          #   2. 将 kubeconfig 内容写入 GitHub secret STAGING_KUBECONFIG;
          #   3. 配置 secrets.AWS_ROLE_TO_ASSUME_STAGING 用于镜像仓库/基础设施访问;
          #   4. 在 GitHub Environment "staging" 中配置保护规则与所需 secrets;
          #   5. 镜像仓库 ghcr.io 对该集群可达(imagePullSecret 如需)。
          echo "::notice title=TODO(P1-15)::未配置 STAGING_KUBECONFIG, 跳过真实 dry-run; 前置条件清单见日志与 deployment/CD_VERIFICATION.md"
          exit 0
        fi
        echo "$STAGING_KUBECONFIG" > /tmp/kubeconfig-staging
        export KUBECONFIG=/tmp/kubeconfig-staging
        helm upgrade --install xagent deployment/helm \
          --namespace staging --create-namespace \
          --set image.tag="${{ needs.build.outputs.image-tag }}" \
          --dry-run --debug
      env:
        STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}

    # TODO(P1-15): smoke test 依赖真实 staging 端点; 配置 STAGING_SMOKE_URL secret 后自动启用真实探测。
    - name: Run smoke tests (real when STAGING_SMOKE_URL is set)
      run: |
        if [ -z "${STAGING_SMOKE_URL:-}" ]; then
          echo "::notice title=TODO(P1-15)::Smoke tests skipped - set STAGING_SMOKE_URL secret to enable real probing."
          exit 0
        fi
        curl -fsS "$STAGING_SMOKE_URL/health" || exit 1

    - name: Notify deployment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'ℹ️ Staging: chart 验证(lint/template)已真实执行; helm upgrade --dry-run 需配置 STAGING_KUBECONFIG 后生效(见 deployment/CD_VERIFICATION.md), 镜像: ${{ needs.build.outputs.image-tag }}'
          });
      continue-on-error: true

  deploy-production:
    needs: [build, scan-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://xagent.example.com

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}
        aws-region: us-east-1
      continue-on-error: true

    # TODO(P0-09): 占位 deploy——当前无真实 production 集群, 仅打印镜像信息, 不执行任何部署动作。
    # 接入真实基础设施后, 替换为下方被注释的 kubectl 命令(或 Helm)并移除本注释。
    - name: Deploy to production (placeholder, TODO)
      run: |
        echo "::notice title=TODO::Production deploy is a placeholder - no real cluster configured. Image: ${{ needs.build.outputs.image-tag }}"
        # kubectl set image deployment/xagent-api xagent-api=${{ needs.build.outputs.image-tag }} -n production
        # kubectl rollout status deployment/xagent-api -n production
      env:
        DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

    # TODO(P0-09): 占位 health check——无真实 production 环境可探测; 接入后替换为真实健康检查。
    - name: Run health checks (placeholder, TODO)
      run: |
        echo "::notice title=TODO::Health checks are a placeholder - no production environment to probe."
        # curl -f https://xagent.example.com/health || exit 1
      continue-on-error: true

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Notify deployment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Production deploy 为占位步骤(TODO: 未接入真实集群), 镜像: ${{ needs.build.outputs.image-tag }}'
          });
      continue-on-error: true

  rollback:
    runs-on: ubuntu-latest
    if: failure() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production')
    environment:
      name: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}
        aws-region: us-east-1
      continue-on-error: true

    # TODO(P0-09): 占位 rollback——当前无真实 production 集群, 不执行任何回滚动作。
    # 接入真实基础设施后, 替换为下方被注释的 kubectl 命令并移除本注释。
    - name: Rollback production deployment (placeholder, TODO)
      run: |
        echo "::notice title=TODO::Rollback is a placeholder - no real cluster configured."
        # kubectl rollout undo deployment/xagent-api -n production
        # kubectl rollout status deployment/xagent-api -n production
      continue-on-error: true

    - name: Notify rollback
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Production rollback 为占位步骤(TODO: 未接入真实集群), 未执行真实回滚'
          });
      continue-on-error: true

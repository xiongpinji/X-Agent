name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily security scan at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # STAGE 1: Code Quality & Security
  # ============================================================================

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint

      - name: Run ruff linter
        run: ruff check backend/ --output-format=github

      - name: Run ruff formatter check
        run: ruff format backend/ --check

      - name: Run mypy type checker
        run: mypy backend/ --ignore-missing-imports --junit-xml=mypy-report.xml || true

      - name: Run pylint
        run: pylint backend/ --exit-zero --output-format=json > pylint-report.json || true

      - name: Upload linting reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-reports
          path: |
            mypy-report.xml
            pylint-report.json

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt

      - name: Run Safety check
        run: |
          safety check --json > safety-report.json || true
          safety check

      - name: Run Semgrep
        run: |
          semgrep --config=p/security-audit backend/ --json -o semgrep-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

  # ============================================================================
  # STAGE 2: Testing
  # ============================================================================

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://xagent:xagent@localhost:5432/xagent
          REDIS_URL: redis://localhost:6379/0
          XAGENT_ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html --junitxml=junit.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            htmlcov/

  # ============================================================================
  # STAGE 3: Build
  # ============================================================================

  build:
    name: Build Docker Image
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ${{ steps.meta.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  # ============================================================================
  # STAGE 4: Deploy to Staging
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging-api.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name xagent-staging --region ${{ secrets.AWS_REGION }}

      - name: Deploy with Helm
        run: |
          helm repo add xagent ${{ secrets.HELM_REPO_URL }}
          helm repo update
          helm upgrade --install xagent xagent/xagent \
            --namespace staging \
            --values deployment/helm/values-staging.yaml \
            --set image.tag=${{ needs.build.outputs.image-tag }} \
            --set secrets.enabled=true \
            --set-string secrets.databaseUrl="${{ secrets.STAGING_DATABASE_URL }}" \
            --set-string secrets.redisUrl="${{ secrets.STAGING_REDIS_URL }}" \
            --set-string secrets.apiKey="${{ secrets.STAGING_API_KEY }}" \
            --set-string secrets.langfusePublicKey="${{ secrets.STAGING_LANGFUSE_PUBLIC_KEY }}" \
            --set-string secrets.langfuseSecretKey="${{ secrets.STAGING_LANGFUSE_SECRET_KEY }}" \
            --wait \
            --timeout 10m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/xagent-api -n staging --timeout=5m
          kubectl rollout status deployment/xagent-worker -n staging --timeout=5m

      - name: Run smoke tests
        run: |
          for i in {1..30}; do
            if curl -f https://staging-api.example.com/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for service..."
            sleep 10
          done
          exit 1

  # ============================================================================
  # STAGE 5: Notify
  # ============================================================================

  notify:
    name: Notify Status
    needs: [lint, security, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "title": "CI/CD Pipeline ${{ steps.status.outputs.status }}",
                  "text": "Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}",
                  "actions": [
                    {
                      "type": "button",
                      "text": "View Workflow",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

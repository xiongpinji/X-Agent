[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent-partner"
dynamic = ["version"]  # 从 xagent_partner.__version__ 动态读取 (见下方 [tool.setuptools.dynamic])
description = "X-Agent Partner API 官方 Python SDK(当前以源码形式分发, 未发布至 PyPI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "X-Agent Team" }]
keywords = ["x-agent", "partner", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.24",  # SDK 唯一运行时依赖: HTTP 客户端 (xagent_partner.py 直接 import httpx)
]

[tool.setuptools]
py-modules = ["xagent_partner"]

[tool.setuptools.dynamic]
version = { attr = "xagent_partner.__version__" }
